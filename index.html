// === MathVisual 动态数形结合可视化引擎 ===
// 6种动态可视化渲染器：条形模型 / 面积模型 / 数字Bond / 分数条 / 数轴 / 几何图形
// 所有渲染器返回 HTML 字符串（含 SVG 与 CSS 动画），供插入到题目讲解区
const MathVisual = {
  // 总入口：根据 type 调用对应渲染器，未知类型回退到 barModel
  render(type, data){
    const fn = this[type];
    return (typeof fn === 'function') ? fn.call(this, data) : this.barModel.call(this, data);
  },
  // 颜色名 → hex（用于 SVG fill/stroke），支持 --teal/--yellow/--coral/--pink/--navy
  _hex(c){
    const m = {teal:'#00A896', yellow:'#F5B800', coral:'#FB923C', pink:'#E8A0BF', navy:'#1E3A5F'};
    return m[c] || c || '#00A896';
  },
  // 默认调色板（按索引循环）
  _palette(i){ const p=['#00A896','#F5B800','#FB923C','#E8A0BF','#1E3A5F']; return p[i%p.length]; },
  _textColor(hex){
    const c=hex.replace('#','');
    const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
    const lum=0.299*r+0.587*g+0.114*b;
    return lum>150?'#12263F':'#fff';
  },

  // 1. 动态条形模型 —— 加减法 / 部分整体关系
  // data: {total, parts:[{label,val,color}]}
  barModel(data){
    // 兼容 bars 格式（{type:"bar", bars:[{label,value,color}], total}）
    if(data && data.bars && !data.parts){
      data.parts = data.bars.map(b => ({label: b.label, val: b.value, color: b.color}));
      if(data.total == null) data.total = data.parts.reduce((s,p)=>s+(p.val||0),0);
    }
    const parts = (data && data.parts) || [];
    if(!parts.length) return '<div class="mv-empty">暂无条形数据</div>';
    const total = (data.total != null) ? data.total : parts.reduce((s,p)=>s+(p.val||0),0);
    const W=560, H=170, padX=24, barY=66, barH=58;
    const usable = W - padX*2;
    let x = padX, delay = 0;
    const segs = parts.map((p,i)=>{
      const w = total>0 ? Math.max((p.val/total)*usable, 2) : 0;
      const color = this._hex(p.color) || this._palette(i);
      const g = `<g transform="translate(${x},0)">
        <rect class="mv-bar-rect" x="0" y="${barY}" width="${w}" height="${barH}" fill="${color}" rx="5" style="animation-delay:${delay}s"/>
        <text class="mv-bar-text" x="${w/2}" y="${barY+barH/2+5}" text-anchor="middle" font-size="15" font-weight="700" fill="${this._textColor(color)}" style="animation-delay:${delay+0.45}s">${p.val}</text>
        <text x="${w/2}" y="${barY-10}" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">${p.label||''}</text>
      </g>`;
      x += w; delay += 0.18;
      return g;
    }).join('');
    return `<div class="mv-wrap mv-bar-model">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${segs}
        <text x="${W-padX}" y="${barY+barH+30}" text-anchor="end" font-size="14" font-weight="700" fill="#1E3A5F">（合计 = ${total}）</text>
      </svg>
    </div>`;
  },

  // 2. 动态面积模型 —— 两位数乘法
  // data: {a, b, parts:[4个部分值], result}
  // parts 顺序：[a十×b十, a十×b个, a个×b十, a个×b个]
  areaModel(data){
    const {a,b,parts,result} = data;
    const aT=Math.floor(a/10)*10, aO=a%10;   // a 的十位值 / 个位值
    const bT=Math.floor(b/10)*10, bO=b%10;   // b 的十位值 / 个位值
    const sc=13;
    const aTw=aT*sc, aOw=aO*sc, bTh=bT*sc, bOh=bO*sc;
    const totalW=aTw+aOw, totalH=bTh+bOh;
    const padX=36, padY=24;
    const W=totalW+padX*2, H=totalH+padY*2+56;
    // 网格：水平按 a 拆分（左=十位, 右=个位），垂直按 b 拆分（上=十位, 下=个位）
    const blocks=[
      {x:padX,     y:padY,         w:aTw, h:bTh, val:parts[0], color:'#00A896', lab:`${aT}×${bT}`}, // 左上 a十×b十
      {x:padX+aTw, y:padY,         w:aOw, h:bTh, val:parts[2], color:'#F5B800', lab:`${aO}×${bT}`}, // 右上 a个×b十
      {x:padX,     y:padY+bTh,     w:aTw, h:bOh, val:parts[1], color:'#E8A0BF', lab:`${aT}×${bO}`}, // 左下 a十×b个
      {x:padX+aTw, y:padY+bTh,     w:aOw, h:bOh, val:parts[3], color:'#FB923C', lab:`${aO}×${bO}`}, // 右下 a个×b个
    ];
    const blks=blocks.map((bk,i)=>`
      <g class="mv-area-block" style="animation-delay:${i*0.3}s">
        <rect x="${bk.x}" y="${bk.y}" width="${bk.w}" height="${bk.h}" fill="${bk.color}" opacity="0.85"/>
        <text x="${bk.x+bk.w/2}" y="${bk.y+bk.h/2-4}" text-anchor="middle" font-size="15" font-weight="700" fill="${this._textColor(bk.color)}">${bk.val}</text>
        <text x="${bk.x+bk.w/2}" y="${bk.y+bk.h/2+14}" text-anchor="middle" font-size="11" fill="${this._textColor(bk.color)}" opacity="0.88">${bk.lab}</text>
      </g>`).join('');
    return `<div class="mv-wrap mv-area-model">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${blks}
        <text x="${W/2}" y="${H-12}" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">${parts.join(' + ')} = ${result}</text>
      </svg>
    </div>`;
  },

  // 3. 动态数字 Bond —— 数的分解 / 加减法关系
  // data: {total, parts:[{val,color}]}
  numberBond(data){
    const parts=(data && data.parts) || [];
    const total=data.total;
    const n=parts.length;
    const W=340, H=210, topX=W/2, topY=44, bottomY=158, spread=220;
    const pos=(i)=> n<=1 ? W/2 : (W/2 - spread/2 + (spread/(n-1))*i);
    const lines=parts.map((p,i)=>{
      const bx=pos(i);
      const len=Math.hypot(bx-topX, bottomY-topY);
      return `<line class="mv-bond-line" x1="${topX}" y1="${topY}" x2="${bx}" y2="${bottomY}" stroke="${this._hex(p.color)||this._palette(i)}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len}" style="animation-delay:${i*0.2}s"/>`;
    }).join('');
    const pCircles=parts.map((p,i)=>{
      const bx=pos(i);
      const color=this._hex(p.color)||this._palette(i);
      return `<g class="mv-bond-part" style="animation-delay:${0.55+i*0.2}s">
        <circle cx="${bx}" cy="${bottomY}" r="26" fill="${color}"/>
        <text x="${bx}" y="${bottomY+6}" text-anchor="middle" font-size="18" font-weight="700" fill="${this._textColor(color)}">${p.val}</text>
      </g>`;
    }).join('');
    return `<div class="mv-wrap mv-number-bond">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${lines}
        <g class="mv-bond-total">
          <circle cx="${topX}" cy="${topY}" r="30" fill="#1E3A5F"/>
          <text x="${topX}" y="${topY+7}" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">${total}</text>
        </g>
        ${pCircles}
      </svg>
    </div>`;
  },

  // 4. 动态分数条 —— 分数认识 / 分数比较
  // data: {num, total, color}
  fractionStrip(data){
    const {num, total, color} = data;
    const W=560, H=130, padX=24, padY=34, stripW=W-padX*2, stripH=52;
    const segW=stripW/total;
    const fillHex=this._hex(color);
    const fillW=num*segW;
    const dividers=Array.from({length:total-1},(_,i)=>{
      const x=padX+(i+1)*segW;
      return `<line x1="${x}" y1="${padY}" x2="${x}" y2="${padY+stripH}" stroke="#fff" stroke-width="2"/>`;
    }).join('');
    const labels=Array.from({length:total},(_,i)=>{
      const x=padX+i*segW+segW/2;
      return `<text x="${x}" y="${padY+stripH+18}" text-anchor="middle" font-size="11" fill="#475569">${i+1}</text>`;
    }).join('');
    const equivs=[];
    for(let k=2;k<=3;k++){ equivs.push(`${num*k}/${total*k}`); }
    return `<div class="mv-wrap mv-frac-strip">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <text x="${padX}" y="${padY-12}" font-size="14" font-weight="700" fill="#1E3A5F">${num}/${total}</text>
        <rect x="${padX}" y="${padY}" width="${stripW}" height="${stripH}" fill="#fff" stroke="#1E3A5F" stroke-width="2" rx="5"/>
        <rect class="mv-frac-fill" x="${padX}" y="${padY}" width="${fillW}" height="${stripH}" fill="${fillHex}" rx="5"/>
        ${dividers}
        <rect x="${padX}" y="${padY}" width="${stripW}" height="${stripH}" fill="none" stroke="#1E3A5F" stroke-width="2" rx="5"/>
        ${labels}
      </svg>
      <div class="mv-frac-equiv">等值分数：${num}/${total} = ${equivs.join(' = ')}</div>
    </div>`;
  },

  // 5. 动态数轴 —— 整数 / 小数 / 负数 / 运算过程
  // data: {start, end, points:[{pos,label,color}], highlight:[a,b]}
  numberLine(data){
    const {start, end, points, highlight} = data;
    const W=560, H=150, padX=40, padY=78, lineW=W-padX*2-16;
    const range=end-start;
    const pos=(v)=> padX + ((v-start)/range)*lineW;
    const step=Math.max(1, Math.round(range/10));
    let ticks='';
    for(let v=start; v<=end; v+=step){
      const x=pos(v);
      ticks+=`<line x1="${x}" y1="${padY-6}" x2="${x}" y2="${padY+6}" stroke="#475569" stroke-width="1.5"/>`;
      ticks+=`<text x="${x}" y="${padY+24}" text-anchor="middle" font-size="11" fill="#475569">${v}</text>`;
    }
    let hl='';
    if(Array.isArray(highlight) && highlight.length===2){
      const x1=pos(highlight[0]), x2=pos(highlight[1]);
      hl=`<rect x="${x1}" y="${padY-22}" width="${x2-x1}" height="44" fill="#F5B800" opacity="0.22" rx="4"/>`;
    }
    const pts=(points||[]).map((p,i)=>{
      const x=pos(p.pos);
      const color=this._hex(p.color)||this._palette(i);
      return `<g class="mv-nl-point" style="animation-delay:${0.4+i*0.2}s">
        <circle cx="${x}" cy="${padY}" r="10" fill="${color}" stroke="#fff" stroke-width="2.5"/>
        <text x="${x}" y="${padY-18}" text-anchor="middle" font-size="12" font-weight="700" fill="${color}">${p.label!=null?p.label:p.pos}</text>
      </g>`;
    }).join('');
    return `<div class="mv-wrap mv-number-line">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${hl}
        <line x1="${padX}" y1="${padY}" x2="${W-padX+12}" y2="${padY}" stroke="#1E3A5F" stroke-width="2.5"/>
        <polygon points="${W-padX+12},${padY-5} ${W-padX+22},${padY} ${W-padX+12},${padY+5}" fill="#1E3A5F"/>
        ${ticks}
        ${pts}
      </svg>
    </div>`;
  },

  // 6. 动态几何图形 —— 图形认识 / 周长面积计算
  // data: {shape, params:{...}}
  geometry(data){
    const shape=(data && data.shape) || 'rectangle';
    const p=(data && data.params) || {};
    const W=420, H=240;
    let body='', formula='';
    if(shape==='rectangle'){
      const {length,width}=p;
      const sc=15, rw=length*sc, rh=width*sc;
      const x0=(W-rw)/2, y0=(H-rh)/2;
      body=`<rect class="mv-geo-outline" x="${x0}" y="${y0}" width="${rw}" height="${rh}" fill="rgba(0,168,150,0.12)" stroke="#00A896" stroke-width="2.5" rx="3"/>
        <text x="${x0+rw/2}" y="${y0-10}" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">长 ${length}</text>
        <text x="${x0+rw+8}" y="${y0+rh/2+5}" font-size="13" font-weight="700" fill="#1E3A5F">宽 ${width}</text>`;
      formula=`周长 = (${length}+${width})×2 = ${2*(length+width)}　面积 = ${length}×${width} = ${length*width}`;
    } else if(shape==='triangle'){
      const {base,height}=p;
      const sc=13, bw=base*sc, hh=height*sc;
      const cx=W/2, baseY=H-44;
      body=`<polygon class="mv-geo-outline" points="${cx-bw/2},${baseY} ${cx+bw/2},${baseY} ${cx},${baseY-hh}" fill="rgba(0,168,150,0.12)" stroke="#00A896" stroke-width="2.5"/>
        <line x1="${cx}" y1="${baseY-hh}" x2="${cx}" y2="${baseY}" stroke="#FB923C" stroke-width="2" stroke-dasharray="5,4"/>
        <text x="${cx+8}" y="${baseY-hh/2}" font-size="12" font-weight="700" fill="#FB923C">高 ${height}</text>
        <text x="${cx}" y="${baseY+22}" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">底 ${base}</text>`;
      formula=`面积 = 底×高÷2 = ${base}×${height}÷2 = ${base*height/2}`;
    } else if(shape==='parallelogram'){
      const {base,height,side}=p;
      const sc=12, bw=base*sc, hh=height*sc, sl=(side||height)*sc;
      const off=Math.sqrt(Math.max(sl*sl-hh*hh, 16));
      const x0=(W-bw)/2+24, baseY=H-50;
      body=`<polygon class="mv-geo-outline" points="${x0},${baseY} ${x0+bw},${baseY} ${x0+bw-off},${baseY-hh} ${x0-off},${baseY-hh}" fill="rgba(245,184,0,0.15)" stroke="#F5B800" stroke-width="2.5"/>
        <line x1="${x0}" y1="${baseY}" x2="${x0}" y2="${baseY-hh}" stroke="#FB923C" stroke-width="2" stroke-dasharray="5,4"/>
        <text x="${x0-8}" y="${baseY-hh/2}" text-anchor="end" font-size="12" font-weight="700" fill="#FB923C">高 ${height}</text>
        <text x="${x0+bw/2}" y="${baseY+22}" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">底 ${base}</text>`;
      formula=`面积 = 底×高 = ${base}×${height} = ${base*height}`;
    } else if(shape==='trapezoid'){
      const {top,bottom,height}=p;
      const sc=12, tw=top*sc, bw=bottom*sc, hh=height*sc;
      const cx=W/2, baseY=H-50;
      body=`<polygon class="mv-geo-outline" points="${cx-bw/2},${baseY} ${cx+bw/2},${baseY} ${cx+tw/2},${baseY-hh} ${cx-tw/2},${baseY-hh}" fill="rgba(232,160,191,0.18)" stroke="#E8A0BF" stroke-width="2.5"/>
        <line x1="${cx}" y1="${baseY}" x2="${cx}" y2="${baseY-hh}" stroke="#FB923C" stroke-width="2" stroke-dasharray="5,4"/>
        <text x="${cx+8}" y="${baseY-hh/2}" font-size="12" font-weight="700" fill="#FB923C">高 ${height}</text>
        <text x="${cx}" y="${baseY-hh-10}" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">上底 ${top}</text>
        <text x="${cx}" y="${baseY+22}" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">下底 ${bottom}</text>`;
      formula=`面积 = (上底+下底)×高÷2 = (${top}+${bottom})×${height}÷2 = ${(top+bottom)*height/2}`;
    } else if(shape==='circle'){
      const {radius}=p;
      const sc=9, r=radius*sc, cx=W/2, cy=H/2;
      body=`<circle class="mv-geo-outline" cx="${cx}" cy="${cy}" r="${r}" fill="rgba(0,168,150,0.10)" stroke="#00A896" stroke-width="2.5"/>
        <circle cx="${cx}" cy="${cy}" r="3" fill="#1E3A5F"/>
        <line class="mv-circle-radius" x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="#FB923C" stroke-width="2.5"/>
        <text x="${cx+r/2}" y="${cy-8}" text-anchor="middle" font-size="13" font-weight="700" fill="#FB923C">r=${radius}</text>`;
      const C=(2*radius*3.14).toFixed(2), A=(radius*radius*3.14).toFixed(2);
      formula=`周长 = 2πr = 2×3.14×${radius} = ${C}　面积 = πr² = 3.14×${radius}² = ${A}`;
    } else if(shape==='cylinder'){
      const {radius,height}=p;
      const sc=8, r=radius*sc, hh=height*sc, cx=W/2, cy=(H-hh)/2+6;
      body=`<ellipse class="mv-geo-outline" cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.3}" fill="rgba(0,168,150,0.18)" stroke="#00A896" stroke-width="2.5"/>
        <path class="mv-geo-outline" d="M ${cx-r} ${cy} L ${cx-r} ${cy+hh} A ${r} ${r*0.3} 0 0 0 ${cx+r} ${cy+hh} L ${cx+r} ${cy}" fill="rgba(0,168,150,0.10)" stroke="#00A896" stroke-width="2.5"/>
        <ellipse cx="${cx}" cy="${cy+hh}" rx="${r}" ry="${r*0.3}" fill="none" stroke="#00A896" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.6"/>
        <line x1="${cx-r}" y1="${cy}" x2="${cx-r}" y2="${cy+hh}" stroke="#FB923C" stroke-width="2"/>
        <text x="${cx-r-8}" y="${cy+hh/2}" text-anchor="end" font-size="12" font-weight="700" fill="#FB923C">高 ${height}</text>
        <line class="mv-circle-radius" x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="#FB923C" stroke-width="2"/>
        <text x="${cx+r/2}" y="${cy-8}" text-anchor="middle" font-size="12" font-weight="700" fill="#FB923C">r=${radius}</text>`;
      formula=`体积 = πr²h = 3.14×${radius}²×${height} = ${(radius*radius*height*3.14).toFixed(2)}`;
    } else {
      return '<div class="mv-empty">未知图形类型</div>';
    }
    return `<div class="mv-wrap mv-geometry">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${body}
      </svg>
      <div class="mv-geo-formula">${formula}</div>
    </div>`;
  }
};

/* ============================================================
   学习引擎套件 v4：学习路径 / 漏洞检测 / 进度追踪 / 时长控制
   - 所有渲染方法返回 HTML 字符串，不直接操作 DOM（TimeController 计时器除外）
   - 颜色统一使用 CSS 变量：--teal --yellow --coral --navy --pink
   - 依赖外部数据：MATH_BY_GRADE / VOCAB_BY_GRADE / saveState / toast
============================================================ */

// === 1. LearningPath 学习路径引擎 ===
// 日任务（40分钟两科）/ 周计划 / 阶段考核 / 完成检查 / 渲染
const LearningPath = {
  // 易错点提示库（按知识点关键词匹配）
  _pitfalls: {
    '进位':'连续进位时容易漏加进位1，建议用条形模型可视化每次进位过程。',
    '退位':'退位减法容易忘记从高位借1，在被减数高位标注借位点再算。',
    '周长':'周长是"一圈"的长度，长方形周长=(长+宽)×2，别忘乘2。',
    '乘法':'笔算乘法注意数位对齐，部分积相加时别漏进位。',
    '除法':'试商时看被除数前两位，余数必须比除数小。',
    '小数':'小数加减法小数点必须对齐，结果别忘点小数点。',
    '分数':'分数乘法分子×分子、分母×分母，能约分先约分更简单。',
    '方程':'等式两边同加/减/乘/除同一个数，等式仍成立。',
    '面积':'三角形面积=底×高÷2，平行四边形面积=底×高（不÷2）。',
    '认识':'新概念先观察实物或图示，再抽象出定义。'
  },
  _pitfallFor(topic){
    if(!topic) return '认真审题，分步计算，做完记得验算。';
    for(const k in this._pitfalls){ if(topic.indexOf(k)>=0) return this._pitfalls[k]; }
    return '认真审题，分步计算，做完记得验算。';
  },
  _fmt(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${da}`; },

  // 从知识树找下一个推荐知识点（优先叶子 current，其次任意 current，其次 locked）
  _findNextKnowledge(grade){
    const data = MATH_BY_GRADE[grade];
    if(!data) return {name:'万以内加减法', parentName:'数与代数'};
    let leafCurrent=null, anyCurrent=null, anyLocked=null;
    const walk=(nodes, parent)=>{
      for(const n of nodes){
        const isLeaf = !n.children || !n.children.length;
        if(n.level==='current'){
          if(isLeaf && !leafCurrent) leafCurrent = {name:n.name, parentName:parent};
          if(!anyCurrent) anyCurrent = {name:n.name, parentName:parent};
        }
        if(n.level==='locked' && !anyLocked && isLeaf) anyLocked = {name:n.name, parentName:parent};
        if(n.children && n.children.length) walk(n.children, n.name);
      }
    };
    walk(data.knowledge, '');
    return leafCurrent || anyCurrent || anyLocked || {name:data.title, parentName:''};
  },

  // V5 英语板块推荐：基于完成状态推荐优先板块
  _engV5Boards: [
    {id:'listen', name:'磨耳朵电台', icon:'🎧'},
    {id:'tpr', name:'TPR动作屋', icon:'🏃'},
    {id:'phrase', name:'每日短语', icon:'💬'},
    {id:'vocab', name:'图片词汇库', icon:'🖼️'},
    {id:'sentence', name:'句型启蒙', icon:'📝'},
    {id:'reading', name:'绘本阅读', icon:'📖'},
    {id:'speak', name:'口语对话', icon:'🗣️'},
    {id:'notebook', name:'我的单词本', icon:'📓'}
  ],
  _engV5Topic(state, newWords){
    var v5 = state.engV5 || {};
    var done = v5.completed || [];
    // 找未完成的板块，推荐第一个
    var next = this._engV5Boards.find(function(b){return done.indexOf(b.id)<0;});
    if(next) return next.icon + ' ' + next.name + (newWords ? ' + 复习' + newWords.slice(0,3).join('、') : '');
    // 全部完成，推荐词汇学习
    return '词汇学习：' + (newWords ? newWords.slice(0,3).join('、') : '') + '等8词';
  },
  _engV5Goal(state){
    var v5 = state.engV5 || {};
    var done = v5.completed || [];
    var next = this._engV5Boards.find(function(b){return done.indexOf(b.id)<0;});
    if(next) return '完成「' + next.name + '」板块 + 学会8个新词';
    return '学会8个新词 + 完成3句口语练习';
  },

  // 生成今日任务（按40分钟两科分配）
  generateDailyPlan(state, date){
    const grade = (state.math && state.math.grade) || '3';
    const mathKp = this._findNextKnowledge(grade);
    const engGrade = (state.eng && state.eng.grade) || grade;
    const vocab = VOCAB_BY_GRADE[engGrade] || VOCAB_BY_GRADE['3'];
    const learned = (state.eng && state.eng.learnedWords) || 0;
    // 循环取8个新词（避免越界）
    const newWords = [];
    for(let i=0;i<8 && vocab.length;i++){ newWords.push(vocab[(learned+i) % vocab.length].w); }
    const tasks = [
      {
        subject:'math', subjectName:'数学',
        topic: mathKp.name, parent: mathKp.parentName,
        duration:20, goal:'完成5道题，正确率≥80%',
        visualType:'barModel', minCount:5, minAccuracy:0.8,
        pitfalls: this._pitfallFor(mathKp.name)
      },
      {
        subject:'eng', subjectName:'英语',
        topic: this._engV5Topic(state, newWords),
        duration:20, goal:this._engV5Goal(state),
        newWords, speakGoal:3,
        pitfalls:'新词用自然拼读法拆音；口语先听示范再跟读，注意语音语调。'
      }
    ];
    return { date, tasks, totalTime:40, completeCriteria:'两科任务均达成完成标准，总用时≈40分钟' };
  },

  // 生成本周计划（周一到周日 + 周末阶段考核）
  generateWeeklyPlan(state, weekStart){
    const days = ['周一','周二','周三','周四','周五','周六','周日'];
    const plan = days.map((dn,i)=>{
      const d = new Date(weekStart);
      d.setDate(d.getDate()+i);
      const ds = this._fmt(d);
      const daily = this.generateDailyPlan(state, ds);
      const summary = daily.tasks.map(t=>`${t.subjectName}·${t.topic}`.slice(0,16)).join(' / ');
      return { day:dn, date:ds, summary, totalTime:daily.totalTime, isAssessment:false };
    });
    const grade = (state.math && state.math.grade) || '3';
    const mathData = MATH_BY_GRADE[grade];
    plan[6] = {
      day:'周日', date:plan[6].date, isAssessment:true, totalTime:30,
      summary:'📊 阶段考核：本单元综合测评（10题）',
      unit: mathData ? mathData.title : '当前单元'
    };
    return { weekStart, days:plan, weekendAssessment:true };
  },

  // 阶段考核（每单元学完触发）：从已学知识点抽10题，≥80%解锁下一单元
  generateAssessment(unitName, knowledge){
    const kps = [];
    const walk=(nodes)=>{ for(const n of nodes){ if(n.level==='done' || n.level==='current'){ kps.push(n.name); } if(n.children && n.children.length) walk(n.children); } };
    if(knowledge) walk(knowledge);
    const visuals = ['barModel','areaModel','numberBond','fractionBar','numberLine','geometry'];
    const questions = [];
    for(let i=0;i<10;i++){
      const k = kps.length ? kps[i % kps.length] : '综合复习';
      questions.push({
        idx:i+1, knowledge:k,
        visualType: visuals[i % visuals.length],
        difficulty: i<6 ? 'easy' : (i<9 ? 'medium' : 'hard')
      });
    }
    return {
      unitName, total:10, questions,
      passCriteria:'正确率≥80%（答对8题及以上）解锁下一单元',
      unlockNext:'达标自动解锁下一单元知识点；未达标生成针对性补救练习。'
    };
  },

  // 检查今日任务完成情况
  checkDailyCompletion(state, date){
    const plan = this.generateDailyPlan(state, date);
    const log = (state.answerLog||[]).filter(a=>a.date===date);
    const tasks = plan.tasks.map(t=>{
      let done=false, detail='';
      if(t.subject==='math'){
        const recs = log.filter(a=>a.subject==='math' && a.knowledge && a.knowledge.indexOf(t.topic)>=0);
        const correct = recs.filter(a=>a.result==='correct').length;
        const acc = recs.length ? correct/recs.length : 0;
        done = recs.length>=t.minCount && acc>=t.minAccuracy;
        detail = `${recs.length}/${t.minCount} 题，正确率 ${recs.length?Math.round(acc*100):0}%`;
      } else {
        const todaySpoken = log.filter(a=>a.subject==='eng' && a.result==='correct').length;
        const wCount = (state.eng && state.eng.learnedWords) || 0;
        done = wCount>=8 && todaySpoken>=t.speakGoal;
        detail = `已学词 ${Math.min(wCount,8)}/8，口语 ${Math.min(todaySpoken,t.speakGoal)}/${t.speakGoal}`;
      }
      return { subject:t.subject, subjectName:t.subjectName, topic:t.topic, done, detail, duration:t.duration };
    });
    const allDone = tasks.every(r=>r.done);
    const doneTime = tasks.filter(r=>r.done).reduce((s,r)=>s+r.duration,0);
    return { date, tasks, allDone, doneTime, totalTime:plan.totalTime };
  },

  // 渲染今日任务卡片 HTML
  renderDailyPlan(state){
    const today = this._fmt(new Date());
    const plan = this.generateDailyPlan(state, today);
    const check = this.checkDailyCompletion(state, today);
    const taskCard = (t,i)=>{
      const r = check.tasks[i] || {};
      const color = t.subject==='math' ? 'var(--teal)' : 'var(--coral)';
      const icon = t.subject==='math' ? '📐' : '🔤';
      const status = r.done ? '✅ 已完成' : '⏳ 进行中';
      const statusBg = r.done ? 'var(--teal-100)' : 'var(--yellow-100)';
      const statusColor = r.done ? 'var(--teal-700)' : 'var(--yellow-700)';
      return `<div style="background:var(--surface);border:1px solid var(--ink-100);border-radius:var(--radius-lg);padding:14px 16px;border-left:4px solid ${color};box-shadow:var(--shadow-sm)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:22px">${icon}</span>
            <div>
              <div style="font-weight:700;color:var(--text-1);font-size:15px">${t.subjectName} · ${t.duration}分钟</div>
              <div style="font-size:12px;color:var(--text-2)">${t.parent?t.parent+' · ':''}${t.topic}</div>
            </div>
          </div>
          <span style="background:${statusBg};color:${statusColor};padding:3px 10px;border-radius:var(--radius-full);font-size:12px;font-weight:600">${status}</span>
        </div>
        <div style="background:var(--teal-50);border-radius:var(--radius-sm);padding:8px 10px;font-size:12.5px;color:var(--teal-700);margin-bottom:6px">🎯 <b>完成标准：</b>${t.goal}</div>
        <div style="background:var(--yellow-50);border-radius:var(--radius-sm);padding:8px 10px;font-size:12.5px;color:var(--yellow-700);margin-bottom:6px">⚠️ <b>易错点：</b>${t.pitfalls}</div>
        <div style="font-size:12px;color:var(--text-3)">📊 进度：${r.detail||'尚未开始'}</div>
      </div>`;
    };
    return `<div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:700;color:var(--text-1);font-size:16px">📅 今日学习计划 · ${today}</div>
        <div style="background:var(--navy);color:#fff;padding:4px 12px;border-radius:var(--radius-full);font-size:12px;font-weight:600">总时长 ${plan.totalTime} 分钟</div>
      </div>
      ${plan.tasks.map(taskCard).join('')}
      <div style="background:linear-gradient(135deg,var(--teal-50),var(--yellow-50));border-radius:var(--radius-lg);padding:12px 14px;font-size:13px;color:var(--text-2);text-align:center">
        ${check.allDone?'🎉 太棒了！今日任务全部完成！':`继续加油，已完成 ${check.doneTime}/${check.totalTime} 分钟`}
      </div>
    </div>`;
  },

  // 渲染周计划 HTML
  renderWeeklyPlan(state){
    const today = new Date();
    const weekStart = new Date(today);
    const dow = (today.getDay()+6)%7; // 周一=0
    weekStart.setDate(today.getDate()-dow);
    const ws = this._fmt(weekStart);
    const plan = this.generateWeeklyPlan(state, ws);
    const todayStr = this._fmt(today);
    const dayCard = (d)=>{
      const isToday = d.date===todayStr;
      const bg = d.isAssessment ? 'linear-gradient(135deg,var(--pink),var(--coral))' : 'var(--surface)';
      const color = d.isAssessment ? '#fff' : 'var(--text-1)';
      const sub = d.isAssessment ? 'rgba(255,255,255,.9)' : 'var(--text-2)';
      return `<div style="background:${bg};border:1px solid ${d.isAssessment?'transparent':'var(--ink-100)'};border-radius:var(--radius-md);padding:10px 8px;${isToday?'box-shadow:var(--shadow-teal);border:2px solid var(--teal)':''}">
        <div style="font-weight:700;color:${color};font-size:13px">${d.day}${isToday?'·今天':''}</div>
        <div style="font-size:11px;color:${sub};margin:4px 0;line-height:1.4">${d.summary}</div>
        <div style="font-size:11px;color:${sub};font-weight:600">${d.totalTime}分钟</div>
      </div>`;
    };
    return `<div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-weight:700;color:var(--text-1);font-size:16px">📆 本周计划 · ${plan.weekStart} 起</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${plan.days.map(dayCard).join('')}</div>
      <div style="background:var(--navy-50);border-radius:var(--radius-md);padding:10px 12px;font-size:12.5px;color:var(--navy)">
        📊 <b>周末阶段考核：</b>${plan.days[6].summary}。达标（≥80%）即可解锁下一单元，未达标自动生成针对性补救练习。
      </div>
    </div>`;
  }
};

// === 2. WeaknessDetector 漏洞检测引擎 ===
// 答题记录 / 掌握度计算 / 真实掌握检测 / 薄弱点分析 / 补救建议 / 渲染
const WeaknessDetector = {
  // 记录答题（每次答题后调用）
  // question: {subject, knowledge, difficulty, visualType}  result: 'correct'|'wrong'|'timeout'|'hint'
  recordAnswer(state, question, result, timeUsed){
    if(!state.answerLog) state.answerLog = [];
    const rec = {
      ts: Date.now(),
      date: LearningPath._fmt(new Date()),
      subject: question.subject || 'math',
      knowledge: question.knowledge || '未知知识点',
      difficulty: question.difficulty || 'medium',
      visualType: question.visualType || 'barModel',
      result: result,
      timeUsed: timeUsed || 0,
      hintUsed: result === 'hint'
    };
    state.answerLog.push(rec);
    if(state.answerLog.length > 200) state.answerLog = state.answerLog.slice(-200);
    // 同步掌握度缓存
    if(!state.math) state.math = {};
    if(!state.math.mastery) state.math.mastery = {};
    const m = state.math.mastery;
    const k = rec.knowledge;
    if(!m[k]) m[k] = {correct:0, wrong:0, hint:0, times:[], lastSeen:0};
    if(rec.result==='correct') m[k].correct++;
    else if(rec.result==='wrong' || rec.result==='timeout') m[k].wrong++;
    if(rec.hintUsed) m[k].hint++;
    m[k].times.push(rec.timeUsed);
    if(m[k].times.length > 30) m[k].times = m[k].times.slice(-30);
    m[k].lastSeen = rec.ts;
    if(typeof saveState==='function') saveState();
    return rec;
  },

  // 计算知识点掌握度（0-100）：正确率60% + 用时合理性20% + 不依赖提示20%
  calcMastery(state, knowledgePoint){
    const m = (state.math && state.math.mastery && state.math.mastery[knowledgePoint]) || null;
    if(!m || (m.correct + m.wrong) === 0) return 0;
    const total = m.correct + m.wrong;
    const accuracy = m.correct / total;                              // 60%
    const avgT = m.times.length ? m.times.reduce((s,t)=>s+(t||0),0)/m.times.length : 30;
    let timeScore;                                                   // 20%
    if(avgT < 5) timeScore = 0.3;            // 过快疑似乱答
    else if(avgT < 10) timeScore = 0.7;
    else if(avgT > 120) timeScore = 0.6;     // 过慢说明不熟练
    else timeScore = 1;
    const hintRatio = total>0 ? m.hint/total : 0;
    const hintScore = 1 - hintRatio;                                 // 20%
    const mastery = Math.round((accuracy*0.6 + timeScore*0.2 + hintScore*0.2) * 100);
    return Math.max(0, Math.min(100, mastery));
  },

  // 检测是真正掌握还是刷题：至少答对3题 + 用时稳定 + 不靠提示 + 正确率≥80%
  detectRealMastery(state, knowledgePoint){
    const m = (state.math && state.math.mastery && state.math.mastery[knowledgePoint]) || null;
    if(!m) return {real:false, reason:'尚无答题记录', mastery:0};
    const total = m.correct + m.wrong;
    const mastery = this.calcMastery(state, knowledgePoint);
    if(m.correct < 3) return {real:false, reason:`答对题数不足（${m.correct}/3）`, mastery};
    // 用时稳定性：标准差/均值 < 0.6
    if(m.times.length >= 3){
      const avg = m.times.reduce((s,t)=>s+t,0)/m.times.length;
      const variance = m.times.reduce((s,t)=>s+(t-avg)*(t-avg),0)/m.times.length;
      const std = Math.sqrt(variance);
      if(avg>0 && std/avg > 0.6) return {real:false, reason:'用时波动大，熟练度不稳定', mastery};
    }
    const hintRatio = total>0 ? m.hint/total : 0;
    if(hintRatio >= 0.2) return {real:false, reason:`过度依赖提示（提示率 ${Math.round(hintRatio*100)}%）`, mastery};
    const acc = total>0 ? m.correct/total : 0;
    if(acc < 0.8) return {real:false, reason:`正确率未达真实掌握标准（${Math.round(acc*100)}%）`, mastery};
    return {real:true, reason:'答对≥3题、用时稳定、不依赖提示、正确率≥80%', mastery};
  },

  // 分析薄弱点（基于近20题）：掌握度<60% 或 错误数>正确数
  analyzeWeakness(state, subject){
    const log = (state.answerLog||[]).filter(a=> !subject || a.subject===subject).slice(-20);
    if(!log.length) return {weakPoints:[], summary:'暂无答题数据', totalAnalyzed:0};
    const byKp = {};
    for(const a of log){
      if(!byKp[a.knowledge]) byKp[a.knowledge] = {correct:0, wrong:0, hint:0, timeout:0, times:[], visualTypes:{}};
      const g = byKp[a.knowledge];
      if(a.result==='correct') g.correct++;
      else if(a.result==='wrong') g.wrong++;
      else if(a.result==='timeout') g.timeout++;
      if(a.hintUsed) g.hint++;
      g.times.push(a.timeUsed);
      g.visualTypes[a.visualType] = (g.visualTypes[a.visualType]||0)+1;
    }
    const weakPoints = [];
    for(const kp in byKp){
      const g = byKp[kp];
      const total = g.correct + g.wrong + g.timeout;
      if(total === 0) continue;
      const mastery = this.calcMastery(state, kp);
      if(mastery < 60 || (g.wrong + g.timeout) > g.correct){
        weakPoints.push({
          knowledge: kp, mastery, correct:g.correct, wrong:g.wrong, timeout:g.timeout, hint:g.hint, total,
          visualTypes: Object.keys(g.visualTypes),
          avgTime: g.times.length ? Math.round(g.times.reduce((s,t)=>s+t,0)/g.times.length) : 0
        });
      }
    }
    weakPoints.sort((a,b)=>a.mastery - b.mastery);
    return { weakPoints, summary:`近${log.length}题检出 ${weakPoints.length} 个薄弱知识点`, totalAnalyzed:log.length };
  },

  // 生成补救建议：推荐具体题目类型和可视化方式
  generateRemediation(state, weakPoints){
    if(!weakPoints || !weakPoints.length) return {items:[], summary:'暂无薄弱点，继续保持！'};
    const visualMap = {
      'barModel':'条形模型（加减法/部分整体）',
      'areaModel':'面积模型（乘法拆分）',
      'numberBond':'数字Bond（数的分解）',
      'fractionBar':'分数条（分数意义）',
      'numberLine':'数轴（数的大小关系）',
      'geometry':'几何图形（周长/面积）'
    };
    const allVisuals = ['barModel','areaModel','numberBond','fractionBar','numberLine','geometry'];
    const items = weakPoints.map(w=>{
      const det = this.detectRealMastery(state, w.knowledge);
      const altVisuals = allVisuals.filter(v=> w.visualTypes.indexOf(v)<0);
      const recommendVisual = altVisuals[0] || w.visualTypes[0] || 'barModel';
      let strategy;
      if(w.hint > 1) strategy = '先看可视化讲解再做，逐步减少提示使用';
      else if(w.timeout > w.wrong) strategy = '限时训练，每题≤60秒，提升反应速度';
      else if(w.mastery < 30) strategy = '回到基础概念，用图示重新理解题意';
      else strategy = '分步计算，每步验算，建立错题本';
      return {
        knowledge: w.knowledge,
        mastery: w.mastery,
        realMastery: det.real,
        reason: det.reason,
        recommendVisual,
        recommendVisualName: visualMap[recommendVisual] || '条形模型',
        exerciseCount: w.mastery<30 ? 8 : (w.mastery<45 ? 6 : 5),
        target: '正确率提升到 ≥85% 且用时稳定',
        strategy
      };
    });
    return { items, summary:`生成 ${items.length} 条补救建议` };
  },

  // 渲染漏洞报告 HTML
  renderWeaknessReport(state){

// === 3. ProgressTracker 进度追踪引擎 ===
// 每日记录 / 周报 / 连续天数 / 进步对比 / 渲染
const ProgressTracker = {
  _fmt(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${da}`; },
  _weekStart(dateStr){
    const d = dateStr ? new Date(dateStr) : new Date();
    const dow = (d.getDay()+6)%7;
    d.setDate(d.getDate()-dow);
    return this._fmt(d);
  },
  _weekDates(weekStart){
    const arr=[]; const d=new Date(weekStart);
    for(let i=0;i<7;i++){ const dd=new Date(d); dd.setDate(d.getDate()+i); arr.push(this._fmt(dd)); }
    return arr;
  },

  // 记录每日学习数据
  recordDaily(state, date, data){
    if(!state.study) state.study = {lastDate:'',todayTime:0,totalTime:0,sessions:[],dailyRecords:{},weeklyPlans:{}};
    if(!state.study.dailyRecords) state.study.dailyRecords = {};
    state.study.dailyRecords[date] = {
      date,
      time: data.time || 0,
      mathTime: data.mathTime || 0,
      engTime: data.engTime || 0,
      accuracy: data.accuracy || 0,
      solvedCount: data.solvedCount || 0,
      newWords: data.newWords || 0,
      newKnowledge: data.newKnowledge || 0,
      ts: Date.now()
    };
    state.study.totalTime = (state.study.totalTime||0) + (data.time||0);
    state.study.lastDate = date;
    if(typeof saveState==='function') saveState();
    return state.study.dailyRecords[date];
  },

  // 生成本周回顾报告（本周 vs 上周对比）
  generateWeeklyReport(state, weekStart){
    const ws = weekStart || this._weekStart();
    const curDates = this._weekDates(ws);
    const prevStart = (()=>{ const d=new Date(ws); d.setDate(d.getDate()-7); return this._fmt(d); })();
    const prevDates = this._weekDates(prevStart);
    const recs = (state.study && state.study.dailyRecords) ? state.study.dailyRecords : {};
    const cur = curDates.map(d=>recs[d]).filter(Boolean);
    const prev = prevDates.map(d=>recs[d]).filter(Boolean);
    const sum = (arr,f)=>arr.reduce((s,x)=>s+(f(x)||0),0);
    const curDays = cur.length;
    const curTime = sum(cur, x=>x.time);
    const curAccuracy = cur.length ? Math.round(sum(cur, x=>x.accuracy)/cur.length) : 0;
    const curSolved = sum(cur, x=>x.solvedCount);
    const curWords = sum(cur, x=>x.newWords);
    const curKnowledge = sum(cur, x=>x.newKnowledge);
    const prevTime = sum(prev, x=>x.time);
    const prevAccuracy = prev.length ? Math.round(sum(prev, x=>x.accuracy)/prev.length) : 0;
    const prevSolved = sum(prev, x=>x.solvedCount);
    // 反复错误点：本周答错≥2次的知识点
    const log = (state.answerLog||[]).filter(a=>curDates.indexOf(a.date)>=0);
    const errKp = {};
    for(const a of log){ if(a.result==='wrong' || a.result==='timeout'){ errKp[a.knowledge] = (errKp[a.knowledge]||0)+1; } }
    const repeated = Object.keys(errKp).filter(k=>errKp[k]>=2).map(k=>({knowledge:k, count:errKp[k]}));
    repeated.sort((a,b)=>b.count-a.count);
    return {
      weekStart: ws, studyDays: curDays, totalTime: curTime, avgAccuracy: curAccuracy,
      solvedCount: curSolved, newWords: curWords, newKnowledge: curKnowledge,
      improvement: {
        time: curTime - prevTime,
        accuracy: curAccuracy - prevAccuracy,
        solved: curSolved - prevSolved
      },
      repeatedErrors: repeated,
      nextSuggestion: this._suggest(cur, repeated, curAccuracy, state),
      engV5Stats: this._engV5Stats(state)
    };
  },
  _engV5Stats(state){
    var v5 = (state && state.engV5) || {};
    return {
      completed: (v5.completed||[]).length,
      totalBoards: 8,
      listenStars: v5.listenStars||0,
      tprLevels: v5.tprLevels||0,
      booksRead: v5.booksRead||0,
      sentencePatterns: v5.sentencePatterns||0,
      notebookSize: (v5.notebook||[]).length,
      repeatAvg: v5.repeatCount ? Math.round(v5.repeatSum / v5.repeatCount) : 0
    };
  },
  _suggest(cur, repeated, acc, state){
    const tips=[];
    if(acc < 70) tips.push('正确率偏低，建议放慢节奏，多看可视化讲解后再练');
    else if(acc >= 90) tips.push('正确率很高，可挑战更难的拓展题');
    else tips.push('正确率良好，继续保持稳定的练习节奏');
    if(repeated.length) tips.push(`重点攻克反复错误点：${repeated.slice(0,3).map(r=>r.knowledge).join('、')}`);
    if(cur.length < 5) tips.push('本周学习天数偏少，建议保证每天40分钟');
    // V5 英语板块建议
    if(state && state.engV5){
      var v5 = state.engV5;
      var done = (v5.completed||[]).length;
      if(done < 8) tips.push('英语 V5 板块还有 ' + (8-done) + ' 个未完成，建议每天完成 1-2 个板块');
      if((v5.booksRead||0) < 3) tips.push('绘本阅读偏少，建议多读绘本培养语感');
      if(v5.repeatCount && v5.repeatCount > 0){
        var avg = Math.round(v5.repeatSum / v5.repeatCount);
        if(avg < 60) tips.push('英语跟读评分偏低（均分'+avg+'），建议多听原音再跟读');
      }
    }
    return tips;
  },

  // 计算连续学习天数
  calcStreak(state){
    const recs = (state.study && state.study.dailyRecords) ? state.study.dailyRecords : {};
    let streak=0; const d=new Date();
    for(let i=0;i<365;i++){
      const dd=new Date(d); dd.setDate(d.getDate()-i);
      const ds=this._fmt(dd);
      if(recs[ds] && recs[ds].time>0) streak++;
      else if(i===0) continue;       // 今天还没学不算中断
      else break;
    }
    return streak;
  },

  // 计算本周进步点（对比上周）
  calcImprovement(state){
    return this.generateWeeklyReport(state, this._weekStart()).improvement;
  },

  // 渲染周报 HTML
  renderWeeklyReport(state){
    const r = this.generateWeeklyReport(state);
    const imp = r.improvement;
    const fmtDelta = (v, higherBetter=true)=>{
      if(v===0) return `<span style="color:var(--text-3)">持平</span>`;
      const good = higherBetter ? v>0 : v<0;
      const arrow = v>0 ? '↑' : '↓';
      return `<span style="color:${good?'var(--teal)':'var(--coral)'}">${arrow}${Math.abs(v)}</span>`;
    };
    const statCard = (label, val, unit, delta, higherBetter)=>{
      return `<div style="background:var(--surface);border:1px solid var(--ink-100);border-radius:var(--radius-md);padding:12px;text-align:center">
        <div style="font-size:11px;color:var(--text-3)">${label}</div>
        <div style="font-size:22px;font-weight:700;color:var(--navy);margin:4px 0">${val}<span style="font-size:12px;color:var(--text-3);font-weight:400">${unit}</span></div>
        <div style="font-size:11px">${delta!=null ? fmtDelta(delta, higherBetter) : ''}</div>
      </div>`;
    };
    const repeatedHtml = r.repeatedErrors.length
      ? r.repeatedErrors.slice(0,5).map(e=>`<span style="background:var(--coral);color:#fff;padding:2px 8px;border-radius:var(--radius-full);font-size:11px;font-weight:600;margin:2px;display:inline-block">${e.knowledge} ×${e.count}</span>`).join('')
      : '<span style="color:var(--teal);font-size:12px">无反复错误点 🎉</span>';
    const suggestHtml = r.nextSuggestion.map((s,i)=>`<li style="margin:4px 0;font-size:12.5px;color:var(--text-2)">${i+1}. ${s}</li>`).join('');
    return `<div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:700;color:var(--text-1);font-size:16px">📈 本周学习周报 · ${r.weekStart} 起</div>
        <div style="background:var(--teal);color:#fff;padding:3px 10px;border-radius:var(--radius-full);font-size:12px;font-weight:600">连续 ${this.calcStreak(state)} 天 🔥</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        ${statCard('学习天数', r.studyDays, '天', null, true)}
        ${statCard('总用时', r.totalTime, '分钟', imp.time, true)}
        ${statCard('平均正确率', r.avgAccuracy, '%', imp.accuracy, true)}
        ${statCard('解题数', r.solvedCount, '题', imp.solved, true)}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="background:var(--surface);border:1px solid var(--ink-100);border-radius:var(--radius-md);padding:12px">
          <div style="font-size:12px;color:var(--text-3);margin-bottom:6px">🌟 本周收获</div>
          <div style="font-size:13px;color:var(--text-2)">掌握新知识点 <b style="color:var(--teal)">${r.newKnowledge}</b> 个 · 新学单词 <b style="color:var(--coral)">${r.newWords}</b> 个</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--ink-100);border-radius:var(--radius-md);padding:12px">
          <div style="font-size:12px;color:var(--text-3);margin-bottom:6px">🔁 反复错误点</div>
          <div style="font-size:12px">${repeatedHtml}</div>
        </div>
      </div>
      ${r.engV5Stats ? '<div style="background:linear-gradient(135deg,rgba(0,168,150,.06),rgba(245,184,0,.06));border:1px solid var(--ink-100);border-radius:var(--radius-md);padding:12px"><div style="font-size:12px;color:var(--text-3);margin-bottom:8px">📚 英语 V5 板块进度</div><div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2)"><span>板块完成 <b style="color:var(--teal)">' + r.engV5Stats.completed + '/' + r.engV5Stats.totalBoards + '</b></span><span>🎧 听力⭐' + r.engV5Stats.listenStars + '</span><span>🏃 TPR ' + r.engV5Stats.tprLevels + '</span><span>📖 绘本 ' + r.engV5Stats.booksRead + '</span><span>📝 句型 ' + r.engV5Stats.sentencePatterns + '</span><span>📓 生词本 ' + r.engV5Stats.notebookSize + '</span>' + (r.engV5Stats.repeatAvg ? '<span>🎤 跟读均分 ' + r.engV5Stats.repeatAvg + '</span>' : '') + '</div></div>' : ''}
      <div style="background:linear-gradient(135deg,var(--navy-50),var(--teal-50));border-radius:var(--radius-md);padding:12px 14px">
        <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px">🎯 下周建议</div>
        <ul style="margin:0;padding-left:18px">${suggestHtml}</ul>
      </div>
    </div>`;
  }
};

// === 4. TimeController 时长控制引擎 ===
// 单科20分钟 / 总40分钟 / 每15分钟护眼提醒 / 顶部固定计时器
const TimeController = {
  _state: { subject:null, startTs:0, elapsed:0, running:false, lastBreakCheck:0, reminders:{} },
  _timer: null,
  SUBJECT_LIMIT: 20*60,    // 单科20分钟
  TOTAL_LIMIT:   40*60,    // 总时长40分钟
  BREAK_INTERVAL:15*60,    // 每15分钟护眼提醒

  // 开始学习会话
  startSession(subject){
    this._state.subject = subject;
    this._state.startTs = Date.now();
    this._state.elapsed = 0;
    this._state.running = true;
    this._state.lastBreakCheck = 0;
    this._state.reminders = {};
    if(this._timer){ clearInterval(this._timer); this._timer=null; }
    this._timer = setInterval(()=>this.tick(), 1000);
    this.renderTimer();
    this._render();
    return { subject, startedAt:new Date().toISOString(), limit:this.SUBJECT_LIMIT };
  },

  // 更新会话时长（每秒调用）
  tick(){
    if(!this._state.running) return null;
    this._state.elapsed = Math.floor((Date.now()-this._state.startTs)/1000);
    // 每15分钟护眼提醒
    if(this._state.elapsed - this._state.lastBreakCheck >= this.BREAK_INTERVAL){
      this._state.lastBreakCheck = this._state.elapsed;
      this._eyeBreak();
    }
    const status = this.checkTimeout();
    this._render();
    return status;
  },

  // 检查是否超时（改为提醒，不强制结束）
  checkTimeout(){
    const e = this._state.elapsed;
    this._state.reminders = this._state.reminders || {};
    const r = this._state.reminders;
    // 提前 10 分钟提醒（30 分钟）
    if(e >= 30*60 && !r.m30){ r.m30 = true; if(typeof toast==='function') toast('⏰ 还有10分钟到40分钟'); }
    // 提前 5 分钟提醒（35 分钟）
    if(e >= 35*60 && !r.m35){ r.m35 = true; if(typeof toast==='function') toast('⏰ 还有5分钟到40分钟'); }
    // 单科 20 分钟：提醒但不强制
    if(e >= this.SUBJECT_LIMIT && !r.subject){
      r.subject = true;
      const subj = this._state.subject==='math'?'数学':(this._state.subject==='eng'?'英语':'本节');
      if(typeof toast==='function') toast(`⏰ ${subj}20分钟到啦，建议切换科目`);
    }
    // 总时长到 40 分钟：不调用 forceBreak，只提醒，继续计时
    if(e >= this.TOTAL_LIMIT){
      if(!r.total){ r.total = true; if(typeof toast==='function') toast('⏰ 已学习40分钟，建议休息！如需继续请点击延时'); }
      return { type:'totalTimeout', elapsed:e, msg:'⏰ 已学习40分钟，建议休息！如需继续请点击延时' };
    }
    return { type:'running', elapsed:e, remaining:this.TOTAL_LIMIT-e };
  },

  // 休息提醒（不停止计时器，改为只提醒，继续计时）
  forceBreak(){
    if(typeof toast==='function') toast('😴 学习时间较长了，建议休息！如需继续可点击延时');
    this._render();
  },

  // 延时会话：用户点击延时，TOTAL_LIMIT 增加 minutes 分钟
  extendSession(minutes){
    this.TOTAL_LIMIT += minutes*60;
    this._state.reminders = this._state.reminders || {};
    this._state.reminders.total = false; // 允许再次到时提醒
    if(typeof toast==='function') toast(`✅ 已延时 ${minutes} 分钟，继续加油！`);
    this._render();
  },

  _eyeBreak(){
    if(typeof toast==='function') toast('👀 护眼提醒：看远方20秒，眨眨眼～');
  },

  _fmt(sec){ sec=Math.max(0,sec); const m=Math.floor(sec/60), s=sec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; },

  // 更新计时器内容
  _render(){
    const el = document.getElementById('tc-timer');
    if(!el) return;
    const e = this._state.elapsed;
    const overtime = e >= this.TOTAL_LIMIT;
    const remain = this.TOTAL_LIMIT - e;
    const subjectRemain = Math.max(0, this.SUBJECT_LIMIT - e);
    const pct = Math.min(100, (e/this.TOTAL_LIMIT)*100);
    const color = overtime ? 'var(--coral)' : (e>=this.SUBJECT_LIMIT ? 'var(--yellow)' : 'var(--teal)');
    const subjectLabel = this._state.subject==='math' ? '📐 数学' : (this._state.subject==='eng' ? '🔤 英语' : '📚 学习中');
    const overtimeMin = Math.floor((e - this.TOTAL_LIMIT)/60);
    const tailHtml = overtime
      ? `<span style="font-size:11px;color:var(--coral);font-weight:700">已超时 ${overtimeMin} 分钟</span><button onclick="TimeController.extendSession(10)" style="padding:4px 12px;background:var(--coral);color:white;border:none;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer">延时10分钟</button>`
      : `<span style="font-size:11px;color:var(--text-3)">单科剩余 ${this._fmt(subjectRemain)}</span>`;
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center">
        <span style="font-size:14px;font-weight:600;color:var(--navy)">${subjectLabel}</span>
        <div style="background:var(--ink-100);border-radius:var(--radius-full);width:180px;height:8px;overflow:hidden">
          <div style="background:${color};height:100%;width:${pct}%;transition:width 1s linear"></div>
        </div>
        <span style="font-weight:700;color:${color};font-size:15px;font-variant-numeric:tabular-nums">⏱️ ${this._fmt(Math.abs(remain))}${overtime?' ⚠️':''}</span>
        ${tailHtml}
      </div>`;
  },

  // 渲染计时器（顶部固定，挂载到 DOM）
  renderTimer(){
    let el = document.getElementById('tc-timer');
    if(!el){
      el = document.createElement('div');
      el.id = 'tc-timer';
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--glass-border);padding:8px 16px;display:flex;justify-content:center;align-items:center;box-shadow:var(--shadow-sm)';
      document.body.appendChild(el);
      document.body.style.paddingTop = '44px';
    }
    this._render();
    return '<div id="tc-timer-mount" style="color:var(--text-3);font-size:12px;text-align:center;padding:8px">⏱️ 计时器已挂载到页面顶部</div>';
  },

  // 停止会话
  stop(){
    this._state.running = false;
    if(this._timer){ clearInterval(this._timer); this._timer=null; }
    this._render();
  }
};

// === PEP词汇 ===

let _speakUnlocked = false, _speakVoicesReady = false, _pendingSpeak = null;
// 语音播报：兼容移动端，预加载语音列表 + resume 防暂停 + 儿童友好语调 + 优先英文女声
function speak(text){
  if(!('speechSynthesis' in window)) return;
  if(!text) return;
  unlockAudio();
  speechSynthesis.cancel();
  // 确保语音列表已加载（部分浏览器需等待voiceschanged事件）
  let voices = [];
  try{ voices = speechSynthesis.getVoices() || []; }catch(e){}
  if(!voices.length || !voices.some(v=>/en/i.test(v.lang))){
    // 语音列表未就绪或没有英语语音，等待事件
    try{
      speechSynthesis.addEventListener('voiceschanged', function handler(){
        speechSynthesis.removeEventListener('voiceschanged', handler);
        voices = speechSynthesis.getVoices() || [];
        _speakVoicesReady = true;
        if(_pendingSpeak){
          const pending = _pendingSpeak;
          _pendingSpeak = null;
          _doSpeak(pending.text, pending.voices);
        } else {
          _doSpeak(text, voices);
        }
      });
      _pendingSpeak = { text, voices: [] };
      return;
    }catch(e){}
  }
  _doSpeak(text, voices);
}
function _doSpeak(text, voices){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.volume = 1; u.rate = 0.85; u.pitch = 1.1;
  // 优先选择英文女声
  const preferred = voices.find(v=>/en[-_]US/i.test(v.lang) && /female|samantha|victoria|zira|woman|girl|google|microsoft/i.test(v.name))
    || voices.find(v=>/en[-_]US/i.test(v.lang))
    || voices.find(v=>/^en/i.test(v.lang));
  if(preferred){ try{ u.voice = preferred; }catch(e){} }
  // 解决部分浏览器暂停后无法继续的问题
  try{ speechSynthesis.resume(); }catch(e){}
  speechSynthesis.speak(u);
}
// 解锁音频引擎：移动端浏览器要求用户手势交互后才能播放音频
function unlockAudio(){
  if(_speakUnlocked) return;
  _speakUnlocked = true;
  if(!('speechSynthesis' in window)) return;
  try{
    // 触发一次空 utterance 解锁音频上下文
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    speechSynthesis.speak(u);
    // 预加载语音列表
    const voices = speechSynthesis.getVoices() || [];
    if(voices.some(v=>/en/i.test(v.lang))){
      _speakVoicesReady = true;
    } else {
      // 语音未就绪，注册监听等待
      speechSynthesis.addEventListener('voiceschanged', function handler(){
        speechSynthesis.removeEventListener('voiceschanged', handler);
        const v = speechSynthesis.getVoices() || [];
        if(v.some(x=>/en/i.test(x.lang))){
          _speakVoicesReady = true;
          if(_pendingSpeak){
            const pending = _pendingSpeak;
            _pendingSpeak = null;
            _doSpeak(pending.text, v);
          }
        }
      });
    }
  }catch(e){}
  if(typeof toast==='function') toast('🔊 音频已开启');
}
// 转义 HTML 属性中的特殊字符，防止单引号/双引号破坏 onclick 等内联事件
function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function makeClickableSentence(sentence){
  return sentence.split(/(\s+)/).map((tok)=>{
    if(/^\s+$/.test(tok))return tok;
    const clean=tok.replace(/[^a-zA-Z']/g,'').toLowerCase();
    if(!clean)return tok;
    return `<span class="click-word" data-word="${clean}">${tok}</span>`;
  }).join('');
}

            if(!all.length)return'<div style="font-size:13px;color:var(--text-3)">开始学习解锁成就吧！</div>';
            return `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">
              ${all.map(a=>`<div title="${a.name}" style="width:100%;aspect-ratio:1;border-radius:10px;background:${a.done?'linear-gradient(135deg,#FEF3C7,#FDE68A)':'var(--ink-100)'};display:flex;align-items:center;justify-content:center;font-size:18px;${a.done?'cursor:pointer':a.progress<a.target?'cursor:default':''};transition:all var(--dur-base)"
                onmouseenter="this.style.transform='scale(1.1)'" onmouseleave="this.style.transform=''"
                ${a.done?`onclick="toast('🏆 ${a.name}: ${a.desc}')"`:''}>
                ${a.done?a.icon:`<span style="font-size:10px;color:var(--text-3)">${Math.round(a.progress*100)}%</span>`}
              </div>`).join('')}
            </div>
            ${achieved.length?`<div style="font-size:12px;color:var(--text-2)">已解锁 ${achieved.length}/${achieved.length+pending.length} 个</div>`:''}
          `;}catch(e){return'<div style="font-size:13px;color:var(--text-3)">-</div>';}
          }()}</div>
      </div>
    </div>`;
}

/* 总览页 ECharts 图表初始化（学习驾驶舱：7天时长折线 + 知识掌握雷达） */
function initOverviewCharts(){
  if(typeof echarts === 'undefined') return;
  const _fmt = (d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  try{
    // 1) 最近7天学习时长 mini 折线图
    const elL = document.getElementById('ovChartLine');
    if(elL){
      if(window._ovChartLine){ try{ window._ovChartLine.dispose(); }catch(e){} }
      const labels = ['周一','周二','周三','周四','周五','周六','周日'];
      const xLabels = [], vals = [];
      const today = new Date();
      for(let i=0;i<7;i++){
        const d = new Date(today); d.setDate(today.getDate()-(6-i));
        const ds = _fmt(d);
        xLabels.push(labels[(d.getDay()+6)%7]);

// ===== 安全选项生成器（确保正确答案永远在选项中） =====
function _safeMathChoices(problem){
  const ans = problem.answer;
  let choices = problem.choices || [];
  if(choices.indexOf(ans) !== -1) return {choices, correctIdx: choices.indexOf(ans)};
  const a = Number(ans);
  const base = isNaN(a) ? ans : a;
  const distractors = [];
  if(typeof base === 'number'){
    const step = Math.max(1, Math.pow(10, Math.max(0, String(Math.floor(Math.abs(base))).length-2)));
    const pool = [
      base + step, base - step,
      base + step*2, base - step*2,
      Math.round(base * 1.1), Math.round(base * 0.9),
      base + 50, base - 50,
      (()=>{const s=String(Math.abs(Math.floor(base)));return s.length>=3?Number(s[0]+s[2]+s[1])*(base<0?-1:1):base+10;})(),
      (()=>{const s=String(Math.abs(Math.floor(base)));return s.length>=3?Number(s[1]+s[0]+s[2])*(base<0?-1:1):base-10;})()
    ].filter(x => x !== base && !distractors.includes(x) && !choices.includes(x));
    pool.sort((x,y)=>Math.abs(x-base)-Math.abs(y-base));
    distractors.push(...pool.slice(0, Math.max(0, 4 - choices.length - 1)));
    choices.forEach(c => { if(c !== ans && !distractors.includes(c)) distractors.push(c); });
    distractors.length = Math.min(3, distractors.length);
  } else {
    choices.forEach(c => { if(c !== ans && !distractors.includes(c)) distractors.push(c); });
    while(distractors.length < 3) distractors.push(ans + '？');
    distractors.length = 3;
  }
  const merged = [ans, ...distractors];
  for(let i=merged.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[merged[i],merged[j]]=[merged[j],merged[i]];}
  return {choices: merged, correctIdx: merged.indexOf(ans)};
}

// ===== 阶段 5：发散思维（Divergent Thinking）—— 核心 =====
function renderMathDivergent(problem){
  const variants = problem.variants || [];
  if(!variants.length){
    return `<div class="cpa-layer" style="border-left-color:var(--pink);animation:fadeIn .45s ease">
      <span class="cpa-tag" style="background:var(--pink);color:white">STAGE 5 · 发散思维</span>
      <div style="text-align:center;padding:30px 16px;color:var(--text-2);font-size:14px">本题暂无变式题，直接挑战下一题</div>
      <div style="text-align:center">
        <button onclick="mathNextProblem()" style="padding:12px 28px;background:var(--teal);color:white;border:none;border-radius:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(0,168,150,.3)">挑战下一题 →</button>
      </div>
    </div>`;
  }
  const idx = Math.min(window.MATH_SESSION.divergentIdx||0, variants.length);
  if(idx >= variants.length) return _mathDivergentSummary(problem, variants);
  const v = variants[idx];
  const notes = window.MATH_SESSION.divergentNotes || [];
  return `<div class="cpa-layer" style="border-left-color:var(--pink);animation:fadeIn .45s ease">
    <span class="cpa-tag" style="background:var(--pink);color:white">STAGE 5 · 发散思维</span>
    <div style="display:flex;align-items:center;gap:10px;margin:14px 0 10px">
      <div style="width:30px;height:30px;border-radius:50%;background:var(--pink);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px">${idx+1}</div>
      <div style="font-size:13px;color:var(--text-3);font-weight:600">变式题 ${idx+1} / ${variants.length} · 举一反三</div>
    </div>
    <div style="padding:16px 18px;background:linear-gradient(135deg,var(--pink),#F4C2D8);color:white;border-radius:12px;font-size:16px;font-weight:700;line-height:1.7">
      🔄 ${v.question}
    </div>
    <div style="margin-top:10px;font-size:13px;color:var(--text-2)">参考算式：<span style="font-family:'Inter',sans-serif;font-weight:800;color:var(--navy)">${v.formula}</span> · 答案：<span style="font-weight:800;color:var(--teal)">${v.answer}</span></div>
    <div style="margin-top:16px;padding:14px 16px;background:var(--yellow-soft);border-radius:10px;border:1px dashed var(--yellow)">
      <div style="font-size:13px;font-weight:800;color:var(--yellow-700);margin-bottom:8px">🤔 想一想：这道题和刚才的原题，<b>哪里一样？哪里不一样？</b></div>
      <textarea id="mathDivergentInput" placeholder="说说你的发现..." style="width:100%;min-height:72px;padding:10px 12px;border:1.5px solid rgba(245,184,0,.3);border-radius:10px;font-size:14px;font-family:inherit;resize:vertical;box-sizing:border-box">${notes[idx]?String(notes[idx]).replace(/</g,'&lt;'):''}</textarea>
    </div>
    <div style="text-align:center;margin-top:14px;display:flex;gap:10px;justify-content:center">
      ${idx>0?`<button onclick="mathDivergentBack()" style="padding:10px 22px;background:white;border:1.5px solid var(--ink-100);color:var(--text-2);border-radius:20px;font-weight:700;cursor:pointer">← 上一题</button>`:''}
      <button onclick="mathDivergentNext()" style="padding:10px 28px;background:linear-gradient(135deg,var(--pink),var(--coral));color:white;border:none;border-radius:20px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(232,160,191,.4)">${idx<variants.length-1?'下一道变式 →':'查看举一反三总结 →'}</button>
    </div>
  </div>`;
}

// 发散思维：下一题（保存当前笔记）
function mathDivergentNext(){
  const ta = document.getElementById('mathDivergentInput');
  const note = ta ? ta.value.trim() : '';
  if(!window.MATH_SESSION.divergentNotes) window.MATH_SESSION.divergentNotes = [];
  window.MATH_SESSION.divergentNotes[window.MATH_SESSION.divergentIdx] = note;
  window.MATH_SESSION.divergentIdx = (window.MATH_SESSION.divergentIdx||0) + 1;
  updateMathStage();
}
// 发散思维：上一题（保存当前笔记后回退）
function mathDivergentBack(){
  if((window.MATH_SESSION.divergentIdx||0) <= 0) return;
  const ta = document.getElementById('mathDivergentInput');
  if(!window.MATH_SESSION.divergentNotes) window.MATH_SESSION.divergentNotes = [];
  if(ta) window.MATH_SESSION.divergentNotes[window.MATH_SESSION.divergentIdx] = ta.value.trim();
  window.MATH_SESSION.divergentIdx--;
  updateMathStage();
}

// 举一反三总结页
function _mathDivergentSummary(problem, variants){
  const notes = window.MATH_SESSION.divergentNotes || [];
  const method = _mathMethodName(problem);
  return `<div class="cpa-layer" style="border-left-color:var(--teal);animation:fadeIn .5s ease">
    <span class="cpa-tag concrete">🎉 举一反三 · 总结</span>
    <div style="margin:16px 0;padding:18px 20px;background:linear-gradient(135deg,var(--teal-soft),var(--yellow-soft));border-radius:14px;border:1px solid rgba(0,168,150,.18)">
      <div style="font-size:15px;font-weight:800;color:var(--navy);margin-bottom:10px">🌟 你发现了什么？</div>
      <div style="font-size:14px;color:var(--ink-700);line-height:1.85">
        原题考的是 <b style="color:var(--teal)">${problem.knowledge}</b>，核心方法是 <b style="color:var(--coral)">${method}</b>。<br>
        ${variants.length} 道变式题虽然<b>数字和情境变了</b>，但<b style="color:var(--teal)">解题思路是一样的</b>：${problem.hint}<br>
        <span style="color:var(--text-2)">💡 学会一类题的通法，比刷一百道题更有用！</span>
      </div>
    </div>

        <div style="font-size:13px;font-weight:800;color:var(--text-2);margin-bottom:8px">📝 你的思考记录：</div>
        ${notes.map((n,i)=>n?`<div style="padding:10px 14px;background:white;border-radius:10px;margin-bottom:6px;font-size:13px;color:var(--ink-700);border-left:3px solid var(--pink)"><b>变式 ${i+1}：</b>${String(n).replace(/</g,'&lt;')}</div>`:'').join('')}
      </div>
    `:''}
    <div style="text-align:center;margin-top:18px">
      <button onclick="mathNextProblem()" style="padding:13px 34px;background:linear-gradient(135deg,var(--teal),#14C3B2);color:white;border:none;border-radius:24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(0,168,150,.35)">
        🚀 挑战下一题 →

// ===== 统一答题处理（选择 / 填空通用入口） =====
// kind: 'discovery' | 'solve' ；chosenIdx/correctIdx 为选项在 choices 中的下标
function mathAnswer(el, chosenIdx, correctIdx, kind, stepIdx){
  const isCorrect = chosenIdx === correctIdx;
  const container = el.parentElement;
  if(container){
    container.querySelectorAll('.wp-choice').forEach(c=>c.classList.remove('correct','wrong'));
    el.classList.add(isCorrect?'correct':'wrong');
    // 解题阶段答错时揭示正确答案；发现阶段不揭示，让孩子再想
    if(!isCorrect && kind==='solve'){
      container.querySelectorAll('.wp-choice').forEach(c=>{ if(parseInt(c.dataset.idx)===correctIdx) c.classList.add('correct'); });
    }
  }

  // ---- 发现阶段 ----
  if(kind==='discovery'){
    const fb = document.getElementById('mathDiscoveryFeedback');
    const steps = _mathDiscoverySteps(window.CURRENT_MATH_PROBLEM);
    const step = steps[stepIdx] || steps[0];
    if(fb){
      fb.innerHTML = isCorrect
        ? `<div style="padding:12px 14px;background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:10px;font-size:14px;color:var(--teal-700);line-height:1.7">✅ <b>说得好！</b>${step.explain}</div>`
        : `<div style="padding:12px 14px;background:var(--coral-soft);border-left:4px solid var(--coral);border-radius:10px;font-size:14px;color:var(--coral);line-height:1.7">💪 再想想，回头看看场景里的关键信息</div>`;
    }
    if(isCorrect){
      setTimeout(()=>{
        const next = stepIdx + 1;
        if(next >= steps.length){
          mathAdvance('solve');
        }else{
          window.MATH_SESSION.discoveryStep = next;
          updateMathStage();
        }
      }, 900);
    }
    return;
  }

  // ---- 解题阶段 ----
  const problem = window.CURRENT_MATH_PROBLEM || {};
  const timeUsed = Math.max(1, Math.round((Date.now() - (window.MATH_SESSION.startTs||Date.now()))/1000));
  const fb = document.getElementById('mathSolveFeedback');
  const wdQuestion = {
    subject:'math', knowledge:problem.knowledge || '未知知识点',
    difficulty:String(problem.difficulty||'medium'), visualType:problem.visualType||'barModel'
  };

  if(isCorrect){
    // 记录答题到漏洞检测引擎
    try{ WeaknessDetector.recordAnswer(S, wdQuestion, window.MATH_SESSION.hintUsed ? 'hint' : 'correct', timeUsed); }catch(e){}
    setStar(3, '数学场景题');
    if(fb){
      // 数形结合预览：答对后立即展示小图，引导用户进入阶段4看完整动画
      const previewVisual = (typeof MathVisual!=='undefined' && MathVisual.render && problem.visualType)
        ? `<div style="margin-top:12px;max-height:130px;overflow:hidden;border-radius:10px;border:1px dashed var(--teal);opacity:.9;pointer-events:none">${MathVisual.render(problem.visualType, problem.visualData)}</div>`
        : '';
      fb.innerHTML = `<div style="padding:14px 16px;background:linear-gradient(135deg,var(--teal-soft),var(--yellow-soft));border-left:4px solid var(--teal);border-radius:10px;font-size:15px;color:var(--teal-700);font-weight:700;line-height:1.7">🎉 <b>答对了！</b>用时 ${timeUsed} 秒 · +3 ⭐<br><span style="font-size:13px;font-weight:500;color:var(--text-2)">接下来用图形看清这道题的内在结构</span></div>${previewVisual}<div style="margin-top:8px;text-align:center;font-size:12px;color:var(--teal-700);font-weight:700">⬇️ 数形结合预览 · 即将进入阶段4查看完整动画</div>`;
    }
    setTimeout(()=>mathAdvance('explain'), 1100);
  }else{
    window.MATH_SESSION.hintUsed = true;
    window.MATH_SESSION.solveAttempts = (window.MATH_SESSION.solveAttempts||0) + 1;
    // 记录错误（每次错误都记录，供掌握度计算）
    try{ WeaknessDetector.recordAnswer(S, wdQuestion, 'wrong', timeUsed); }catch(e){}
    // 错题本去重后加入
    S.math.wrongProblems = S.math.wrongProblems || [];
    if(!S.math.wrongProblems.some(w=>w.q===problem.question)){
      S.math.wrongProblems.push({q:problem.question, a:String(problem.answer)});
      saveState();
    }
    try{ SpacedReview.add(S.currentProfileId||'default', 'math', problem.id||problem.question); }catch(e){}
    if(fb) fb.innerHTML = `<div style="padding:12px 14px;background:var(--coral-soft);border-left:4px solid var(--coral);border-radius:10px;font-size:14px;color:var(--coral);line-height:1.7">❌ 差一点点！已加入错题本。<b>看看下面的提示再试一次</b></div>`;
    // 重新渲染 solve 阶段，展示提示
    setTimeout(()=>updateMathStage(), 900);
  }
}

// ===== 辅助：场景 emoji =====
function _mathSceneEmoji(problem){
  const t = problem.visualType;
  const m = { barModel:'📊', areaModel:'⬛', numberBond:'🔗', fractionStrip:'🍰', numberLine:'📏', geometry:'📐' };
  if(m[t]) return m[t];
  const s = problem.scene || '';
  if(/草莓|蛋糕|饼干|苹果|果汁|牛奶|糖/.test(s)) return '🍓';
  if(/花坛|花圃|草坪|菜地|花园|花/.test(s)) return '🌺';
  if(/时钟|时|分|秒|火车|出发|温度|体温/.test(s)) return '🕐';
  if(/鱼缸|水杯|圆柱|圆锥|水/.test(s)) return '🥛';
  if(/地图|比例尺|鸽子|零件|校园|社区|公园/.test(s)) return '🗺️';
  if(/操场|座位|看台|报告厅|校服|班级|家长|同学|学校/.test(s)) return '🏟️';
  if(/鸡|兔|农场|饲养|动物/.test(s)) return '🐰';
  return '🧮';
}

// ===== 辅助：场景渐变背景 =====
function _mathSceneGradient(problem){
  const t = problem.visualType;
  if(t==='geometry')     return 'linear-gradient(135deg,var(--teal),var(--navy))';
  if(t==='fractionStrip')return 'linear-gradient(135deg,var(--coral),var(--pink))';
  if(t==='numberLine')   return 'linear-gradient(135deg,var(--yellow),var(--coral))';
  if(t==='numberBond')   return 'linear-gradient(135deg,var(--pink),var(--purple))';
  if(t==='areaModel')    return 'linear-gradient(135deg,var(--teal),var(--yellow))';
  return 'linear-gradient(135deg,var(--teal),#14C3B2)';
}

// ===== 辅助：场景引导性问题 =====
function _mathSceneLead(problem){
  return '你能从刚才的故事里，找到哪些关键的数和条件？';
}

// ===== 辅助：从算式提取运算方法名 =====
function _mathMethodName(problem){
  const f = (problem.formula||'').replace(/\s/g,'');
  if(f.indexOf('×')>=0) return '乘法';
  if(f.indexOf('÷')>=0) return '除法';
  if(f.indexOf('+')>=0) return '加法';
  if(f.indexOf('-')>=0) return '减法';
  return problem.knowledge || '计算';
}

// ===== 辅助：生成引导发现步骤（3 步：理解题意 / 找关键信息 / 选方法） =====
function _mathDiscoverySteps(problem){
  const f = (problem.formula||'').replace(/\s/g,'');
  const op = f.indexOf('×')>=0 ? '×' : f.indexOf('÷')>=0 ? '÷' : (f.indexOf('+')>=0 ? '+' : (f.indexOf('-')>=0 ? '-' : '＝'));
  const methodName = _mathMethodName(problem);

  // 稳定轮转：让正确答案不总在第 0 位（按 stepIdx 轮转，保证重渲染时位置一致）
  const rot = (arr, k)=>{ const n=arr.length; k=((k%n)+n)%n; return arr.slice(k).concat(arr.slice(0,k)); };

  // Step 1：理解题意 —— 选项为「正确问法 + 3 个干扰」
  const distractQ = ['求原来有多少','求相差多少','求平均每份是多少','求一共多少'].filter(x=>x!==problem.question);
  let c1 = [problem.question, ...distractQ.slice(0,3)];
  while(c1.length<4) c1.push('以上都不对');
  c1 = rot(c1, 1);

  // Step 2：找关键信息 —— 从算式提取关键数
  const nums = (f.match(/-?\d+(\.\d+)?/g)||[]).filter(n=>parseFloat(n)!==0);
  const keyInfo = `关键数：${nums.slice(0,4).join('、')}${nums.length>4?'...':''}（来自算式 ${problem.formula}）`;
  const c2 = rot([keyInfo, '没有给出任何数', '只有问题没有条件', '只有答案没有过程'], 2);

  // Step 3：选方法 —— 正确运算 + 其它运算干扰
  const otherMethods = ['加法','减法','乘法','除法','画图'].filter(m=>m!==methodName);
  const c3 = rot([methodName, ...otherMethods.slice(0,3)], 1);

  return [
    { q:'📖 再读一遍场景，这道题要我们求什么？', choices:c1, answer:problem.question, explain:`题目问的是：${problem.question}` },
    { q:'🔢 题目给了我们哪些关键的数和条件？', choices:c2, answer:keyInfo, explain:`从场景里能找到关键数，写出算式就是：${problem.formula}` },
    { q:'🧩 要解决这个问题，你觉得该用什么方法？', choices:c3, answer:methodName, explain:`看算式 ${problem.formula} 里有「${op}」，所以用${methodName}来解决。` }
  ];
}

// ===== 辅助：数形结合讲解三层（看图 / 理解 / 推广） =====

  const vmap = { barModel:'条形模型', areaModel:'面积模型', numberBond:'数字 Bond', fractionStrip:'分数条', numberLine:'数轴', geometry:'几何图形' };

  const lookMap = {
    barModel:'看这个条形模型，整条被分成了几段不同颜色的色块，每段代表题目里的一个数量。',

    fractionStrip:'看这条分数条，整体被平均分成了若干等份，涂色部分就是我们要的份数。',

    numberBond:'总数能分解成几个部分，反过来几个部分合起来就是总数 —— 加法和减法是一家人。',
    fractionStrip:'分母是平均分的总份数，分子是取的份数 —— 分数就是「部分占整体的比例」。',
    numberLine:'数轴上右边的数比左边大，两点之间的距离就是它们的差 —— 数的大小关系一目了然。',
    geometry:'周长是「一圈」的长度，面积是「铺满」的大小 —— 图形的边和角决定了它的所有性质。'
  };
  const generalizeMap = {
    barModel:'以后遇到「求总数」或「已知总数求部分」的题，都可以画条形模型帮助理解。',
    areaModel:'以后遇到两位数乘法，都可以拆成面积模型，分块相乘再相加。',
    numberBond:'以后遇到加减法关系，都可以用数字 Bond 看清「分与合」。',
    fractionStrip:'以后遇到分数的题，都可以画分数条，把抽象的分数变成看得见的份数。',
    numberLine:'以后遇到比大小、算距离、看温度的题，都可以借助数轴。',
    geometry:'以后遇到周长面积体积的题，都先画图形标数据，公式自然就出来了。'

    { icon:'🧠', title:'理解 — 数学关系', text:understandMap[t]||`图形揭示了题目里的数量关系。`, bg:'var(--yellow-soft)', color:'var(--yellow-700)' },
    { icon:'🚀', title:'推广 — 通用规律', text:generalizeMap[t]||`以后遇到这类题，都可以用${vname}帮助理解。`, bg:'var(--coral-soft)', color:'var(--coral)' }

function checkMathAnswer(el,val,answer){
  $$('#wpChoices .wp-choice').forEach(c=>c.classList.remove('correct','wrong'));
  const problem = window.CURRENT_MATH_PROBLEM || {};
  const bm = problem.barModel || {};
  const isCorrect = val===answer;

  if(isCorrect){
    el.classList.add('correct');
    setStar(3);
    toast('答对了！+3 ⭐');
  }else{
    el.classList.add('wrong');
    $$('#wpChoices .wp-choice').forEach(c=>{if(parseInt(c.dataset.val)===answer)c.classList.add('correct')});
    const qText=document.querySelector('.wp-q')?.innerText||'数学应用题';
    S.math.wrongProblems.push({q:qText,a:String(answer)});
    saveState();
    try{ SpacedReview.add(S.currentProfileId||'default', 'math', qText); }catch(e){}
    toast('已加入错题本，正确答案已标出');
  }

  // ========== 生成答案讲解图形（数形结合核心） ==========
  const explEl = document.getElementById('wpExplanation');
  const explInner = document.getElementById('wpExplainInner');
  if(explEl && explInner && bm.ming){
    const f = (problem.formula||'').replace(/\s/g,'');
    let type = bm.type;
    if(!type){
      if(f.indexOf('×')>=0) type='multiply';
      else if(f.indexOf('÷')>=0) type='divide';
      else if(f.indexOf('-')>=0) type='subtract';
      else type='add';
    }
    const opSymbol = type==='multiply'?'×':type==='divide'?'÷':type==='add'?'+':'−';
    const a = bm.ming;
    const b = bm.diff;
    let barSvg = '';

    if(type==='multiply'){
      // 乘法：阵列可视化 + 条形模型
      const rows = Math.min(b,4);
      barSvg = `
        <svg viewBox="0 0 360 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:95px">
          <text x="4" y="12" font-size="10" font-weight="800" fill="#005047">📐 阵列模型 · ${b} 行 × ${a} 列</text>
          <g transform="translate(4,20)">
            ${Array(rows).fill(0).map((_,r)=>`
              <g transform="translate(0,${r*18})">
                ${Array(a).fill(0).slice(0,10).map((_,c)=>`
                  <rect x="${c*16}" y="0" width="14" height="14" rx="3" fill="${['#00A896','#F5B800','#8B5CF6','#EF5350'][r%4]}" opacity="0.78"/>

              <text x="${Math.max(40,Math.round(a/(a+b)*340)) + (340-Math.max(40,Math.round(a/(a+b)*340)))/2}" y="17" text-anchor="middle" font-size="11" font-weight="900" fill="#12263F">+ ${b}</text>

              <text x="${Math.max(40,Math.round(a/(a+b)*340)) + (340-Math.max(40,Math.round(a/(a+b)*340)))/2}" y="17" text-anchor="middle" font-size="11" font-weight="900" fill="#B91C1C">− ${b} 吃掉</text>

            `}
            <!-- 大括号箭头 -->
            <path d="M0 32 L0 42 L340 42 L340 32" fill="none" stroke="#00A896" stroke-width="1.8"/>
            <text x="170" y="58" text-anchor="middle" font-size="12" font-weight="900" fill="#005047">结果 = ${answer}</text>
          </g>
        </svg>`;
    }

    explInner.innerHTML = `
      <div style="margin-bottom:10px;display:flex;align-items:center;gap:8px">
        <span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:800;background:${isCorrect?'#D1FAE5;color:#065F46':'#FEE2E2;color:#B91C1C'}">

          ④ 答案：<b style="color:var(--teal);font-size:15px">${answer}</b>

let pickedTile=null;
const PUZZLE_ANSWER=['🍎','🍎','🍎','➕','❓'];
function pickPuzzle(el,val){
  if(el.classList.contains('used'))return;
  $$('.puzzle-tile').forEach(t=>t.style.outline='');
  el.style.outline='3px solid var(--teal)';
  pickedTile={el,val};
}
function placePuzzle(idx){
  const slot=$$('.puzzle-slot')[idx];
  if(!pickedTile){
    if(slot.classList.contains('has')){
      const val=slot.dataset.val;
      slot.classList.remove('has');
      slot.innerText='';
      delete slot.dataset.val;
      const trayTile=$$('.puzzle-tile').find(t=>t.classList.contains('used')&&t.dataset.val===val);
      if(trayTile)trayTile.classList.remove('used');
      checkPuzzle();
    }
    return;
  }
  if(slot.classList.contains('has')){
    const oldVal=slot.dataset.val;
    const oldTile=$$('.puzzle-tile').find(t=>t.classList.contains('used')&&t.dataset.val===oldVal);
    if(oldTile)oldTile.classList.remove('used');
  }
  slot.classList.add('has');
  slot.innerText=pickedTile.val;
  slot.dataset.val=pickedTile.val;
  pickedTile.el.classList.add('used');
  pickedTile.el.style.outline='';
  pickedTile=null;
  checkPuzzle();
}
function checkPuzzle(){
  const slots=$$('.puzzle-slot');
  const board=$('#puzzleBoard');
  let filled=true,correct=true;
  slots.forEach((s,i)=>{
    if(!s.classList.contains('has')){filled=false;return;}
    if(s.dataset.val!==PUZZLE_ANSWER[i]&&!(PUZZLE_ANSWER[i]==='🍎'&&s.dataset.val==='🍎'))correct=false;
  });
  const slot3=slots[3].dataset.val;
  const slot4=slots[4].dataset.val;
  const hasApples=slots[0].dataset.val==='🍎'&&slots[1].dataset.val==='🍎'&&slots[2].dataset.val==='🍎';
  const isOK=filled&&hasApples&&slot3==='➕'&&(slot4==='🍎'||slot4==='❓');
  if(isOK&&!board.classList.contains('ok')){
    board.classList.add('ok');
    setStar(5);
    toast('拼图完成！+5 ⭐');
  }else if(!isOK){
    board.classList.remove('ok');
  }
}
function resetPuzzle(){
  $$('.puzzle-slot').forEach(s=>{s.classList.remove('has');s.innerText='';delete s.dataset.val});
  $$('.puzzle-tile').forEach(t=>{t.classList.remove('used');t.style.outline=''});
  $('#puzzleBoard').classList.remove('ok');
  pickedTile=null;
}

function markFlipCard(idx,isCorrect,q,a){
  const card=$(`#flipCard${idx}`);
  if(isCorrect){
    card.style.opacity='.5';
    card.style.pointerEvents='none';

    card.style.borderRadius='var(--radius-lg)';
    toast('已加入错题本，快去复习吧！');

    <div class="phrase-def">📖 ${p.def}</div>

    </div>
  </div>`;
}

// SpeakEngine：基于场景库 + Web Speech API + 简易 NLP 的口语对话引擎
const SpeakEngine = {
  recognition: null,
  isListening: false,
  SR: (window.SpeechRecognition || window.webkitSpeechRecognition || null),

  // 确保状态字段存在（兼容旧 state，不修改 defaultState）
  init(){
    if(!S.speak.history) S.speak.history = [];
    if(!S.speak.currentScenario) S.speak.currentScenario = null;
    if(typeof S.speak.currentLine !== 'number') S.speak.currentLine = 0;
    if(!S.speak.completed) S.speak.completed = false;
  },
  getScenario(){ return SPEAK_SCENARIOS.find(s=>s.id===S.speak.currentScenario); },
  getTeacherObj(){
    const t = S.speak.teacher || 'Emma';
    return PERSONAS.find(p=>p.name===t) || PERSONAS[0];
  },
  // 当前轮学生的期望回答
  currentExpected(){
    const sc = this.getScenario();
    if(!sc) return null;
    const line = sc.teacherLines[S.speak.currentLine];
    if(!line) return null;
    return sc.studentExpected.find(e=>e.teacherLineId===line.id) || null;
  },

  // 开始新对话：重置历史，老师朗读第一句
  startDialogue(scenarioId, teacherName){
    this.init();
    if(teacherName) S.speak.teacher = teacherName;
    S.speak.currentScenario = scenarioId;
    S.speak.history = [];
    S.speak.currentLine = 0;
    S.speak.completed = false;
    const sc = SPEAK_SCENARIOS.find(s=>s.id===scenarioId);
    if(!sc) return;
    const first = sc.teacherLines[0];
    this.pushMsg('teacher', first.text, {cn:first.cn});
    saveState();
    this.renderDialogue();
    setTimeout(()=>speak(first.text), 350);
  },
  selectScenario(id){
    this.startDialogue(id, null);
    const sc = SPEAK_SCENARIOS.find(s=>s.id===id);
    if(sc) toast(sc.icon + ' 开始场景：' + sc.title);
  },
  selectTeacher(name){
    S.speak.teacher = name;
    const idx = PERSONAS.findIndex(p=>p.name===name);
    if(idx>=0) currentPersona = idx; // 同步旧变量
    saveState();
    toast('👩‍🏫 切换老师：' + name);
    $('#contentArea').innerHTML = renderSpeak();
  },

  pushMsg(role, text, meta){
    S.speak.history.push({role, text, score:null, matched:false, meta:meta||null, ts:Date.now()});
  },

  // 文本输入发送
  sendInput(){
    const inp = $('#seInput');
    if(!inp) return;
    const text = inp.value.trim();
    if(!text) return;
    inp.value = '';
    this.processStudentInput(text);
  },
  onInputKey(e){
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      this.sendInput();
    }
  },

  // 处理孩子输入：评分 + 关键词匹配 + 生成老师回复 + 推进对话
  processStudentInput(text){
    this.init();
    if(S.speak.completed){
      toast('对话已结束，可换一个场景继续哦 ✨');
      return;
    }
    if(!this.getScenario()){
      toast('请先从左侧选一个场景开始对话～');
      return;
    }
    this.pushMsg('student', text, null);
    const idx = S.speak.history.length - 1;
    const exp = this.currentExpected();
    let score = 0, matched = false;
    if(exp){
      score = this.bestScore(exp.suggestions, text);
      matched = this.matchKeywords(text, exp.keywords);
    }
    S.speak.history[idx].score = score;
    S.speak.history[idx].matched = matched;
    const reply = this.generateTeacherReply(matched);
    this.pushMsg('teacher', reply.text, {cn:reply.cn});
    const sc = this.getScenario();
    const nextIdx = S.speak.currentLine + 1;
    if(sc && sc.teacherLines[nextIdx]){
      S.speak.currentLine = nextIdx;
    } else {
      S.speak.completed = true;
      setStar(5, '完成口语对话');
    }
    saveState();
    this.renderDialogue();
    setTimeout(()=>speak(reply.text), 400);
  },

  // 生成老师回复：鼓励语 + 下一段台词（或结束语）
  generateTeacherReply(matched){
    const sc = this.getScenario();
    const good = ['Great! ','Awesome! ','Good job! ','Well done! ','Perfect! ','Excellent! '];
    const bad  = ["That's okay! ","Don't worry! ","Good try! ","Almost! ","Let me help. "];
    const pick = arr => arr[Math.floor(Math.random()*arr.length)];
    const enc = matched ? pick(good) : pick(bad);
    const nextIdx = S.speak.currentLine + 1;
    if(sc && sc.teacherLines[nextIdx]){
      const nl = sc.teacherLines[nextIdx];
      return {text: enc + nl.text, cn: nl.cn};
    }
    return {text: enc + "You did wonderfully! See you next time!", cn:"你表现得太棒了！下次见！"};
  },

  // 关键词匹配 + 模糊容错（包含匹配 或 单词级编辑距离 <= 2）
  matchKeywords(text, keywords){
    const t = (text||'').toLowerCase();
    if(!t) return false;
    const words = t.split(/[^a-z']+/).filter(Boolean);
    return keywords.some(k=>{
      const kk = (k||'').toLowerCase();
      if(!kk) return false;
      if(t.includes(kk)) return true;
      return words.some(w => this.levenshtein(w, kk) <= 2);
    });
  },

  // 在多个候选建议中取最高相似度作为发音得分
  bestScore(suggestions, recognized){
    if(!suggestions || !suggestions.length) return 50;
    return Math.max.apply(null, suggestions.map(s => this.scorePronunciation(s, recognized)));
  },

  // 发音评分：基于 Levenshtein 距离的相似度，转 0-100 分
  scorePronunciation(expected, recognized){
    const e = (expected||'').toLowerCase().replace(/[^a-z\s]/g,'').trim();
    const r = (recognized||'').toLowerCase().replace(/[^a-z\s]/g,'').trim();
    if(!e && !r) return 0;
    if(!e || !r) return r ? 40 : 20;
    const dist = this.levenshtein(e, r);
    const maxLen = Math.max(e.length, r.length);
    const sim = maxLen ? 1 - dist/maxLen : 1;
    return Math.round(Math.max(0, Math.min(1, sim)) * 100);
  },

  // Levenshtein 编辑距离
  levenshtein(a, b){
    if(a === b) return 0;
    if(!a.length) return b.length;
    if(!b.length) return a.length;
    const m = [];
    for(let i=0; i<=b.length; i++) m[i] = [i];
    for(let j=0; j<=a.length; j++) m[0][j] = j;
    for(let i=1; i<=b.length; i++){
      for(let j=1; j<=a.length; j++){
        const cost = (a[j-1] === b[i-1]) ? 0 : 1;
        m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1]+cost);
      }
    }
    return m[b.length][a.length];
  },

  // 语音识别（Web Speech API SpeechRecognition），不支持时降级为文本输入
  toggleMic(){ this.isListening ? this.stopListening() : this.startListening(); },
  startListening(){
    if(!this.SR){
      toast('当前浏览器不支持语音识别，请用文本输入 ✍️');
      const inp = $('#seInput'); if(inp) inp.focus();
      return;
    }
    if(this.isListening){ this.stopListening(); return; }
    try{ this.recognition = new this.SR(); }
    catch(e){ toast('语音识别初始化失败'); return; }
    this.recognition.lang = 'en-US';
    this.recognition.continuous = false;
    this.recognition.interimResults = false;
    this.recognition.maxAlternatives = 1;
    this.recognition.onresult = (ev)=>{
      const tr = ev.results[0][0].transcript;
      const inp = $('#seInput');
      if(inp) inp.value = tr;
      toast('🎤 识别：' + tr);
      this.processStudentInput(tr);
    };
    this.recognition.onerror = (ev)=>{
      this.isListening = false; this.updateMicBtn();
      toast('识别出错：' + (ev.error||'未知'));
    };
    this.recognition.onend = ()=>{
      this.isListening = false; this.updateMicBtn();
    };
    this.recognition.start();
    this.isListening = true;
    this.updateMicBtn();
    toast('🎤 正在听... 请大声回答');
  },
  stopListening(){
    if(this.recognition && this.isListening){
      try{ this.recognition.stop(); }catch(e){}
    }
    this.isListening = false;
    this.updateMicBtn();
  },
  updateMicBtn(){
    const btn = $('#seMic');
    if(!btn) return;
    if(this.isListening) btn.classList.add('recording');
    else btn.classList.remove('recording');
  },

  // 重听老师某句
  replay(idx){
    const m = S.speak.history[idx];
    if(m && m.role==='teacher'){ speechSynthesis.cancel(); speak(m.text); }
  },

  // 单词点查：发音 + 显示释义（复用 WORD_DICT）
  wordClick(word){
    const w = (word||'').toLowerCase().replace(/[^a-z']/g,'');
    if(!w) return;
    speak(w);
    const data = WORD_DICT[w];
    if(data){
      toast('📖 ' + w + ' · ' + data.pos + ' · ' + data.def.slice(0,28) + '…');
    } else {
      toast('🔊 ' + w);
    }
  },

  // 显示建议回答（可点击填入输入框）
  showHint(){
    const box = $('#seHint');
    if(!box) return;
    const exp = this.currentExpected();
    if(!exp){ box.innerHTML = '<span style="color:var(--text-2)">先选一个场景开始对话吧～</span>'; return; }
    box.innerHTML = '<span style="color:var(--text-2);margin-right:4px">💡 你可以说：</span>' +
      exp.suggestions.map(s=>'<span class="se-chip" onclick="SpeakEngine.useHint(this)" data-text="'+s.replace(/"/g,'&quot;')+'">'+s+'</span>').join('');
  },
  toggleHint(){
    const box = $('#seHint');
    if(!box) return;
    if(!this.getScenario()){ toast('先选一个场景开始对话哦～'); return; }
    this.showHint();
    box.classList.toggle('hidden');
  },
  useHint(el){
    const t = el.getAttribute('data-text') || el.textContent;
    const inp = $('#seInput');
    if(inp){ inp.value = t; inp.focus(); }
  },

  scoreFeedback(s){
    if(s>=85) return '发音很棒！🌟';
    if(s>=70) return '不错，继续加油！👍';
    if(s>=50) return '可以再练习一下 💪';
    return '没关系，多说几次 🌱';
  },

  // 渲染对话气泡 HTML
  messagesHTML(){
    const teacher = this.getTeacherObj();
    if(!S.speak.history.length){
      return '<div class="se-empty">'+
        '<div class="se-empty-emoji">🗣️</div>'+
        '<div class="se-empty-title">和 '+teacher.name+' 老师自由交谈吧！</div>'+
        '<div class="se-empty-sub">从左侧选一个场景，点击即可开始对话</div>'+
      '</div>';
    }
    return S.speak.history.map((m, i)=>{
      if(m.role==='teacher'){
        const cn = (m.meta && m.meta.cn) ? '<div class="se-cn">'+m.meta.cn+'</div>' : '';
        return '<div class="msg ai">'+
          '<div class="msg-avatar"><img src="'+teacher.avatar+'" alt=""></div>'+
          '<div>'+
            '<div class="msg-bubble">'+makeClickableSentence(m.text)+'</div>'+
            cn+
            '<div class="se-replay" onclick="SpeakEngine.replay('+i+')"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg> 再听一遍</div>'+
          '</div>'+
        '</div>';
      } else {
        const s = (typeof m.score==='number') ? m.score : null;
        const fb = (s===null) ? '' : this.scoreFeedback(s);
        const matched = m.matched;
        const scoreBox = (s===null) ? '' :
          '<div class="se-score '+(matched?'ok':'low')+'"><span class="se-score-num">'+s+'</span><span class="se-score-fb">'+fb+'</span>'+(matched?' ✅':' 💪')+'</div>';
        return '<div class="msg me"><div>'+
          '<div class="msg-bubble">'+makeClickableSentence(m.text)+'</div>'+
          scoreBox+
        '</div></div>';
      }
    }).join('') + (S.speak.completed ?
      '<div class="se-done">🎉 对话完成！可获得 <strong>+30 ⭐</strong> '+
      '<button class="se-again" onclick="SpeakEngine.startDialogue(S.speak.currentScenario)">再来一次</button></div>' : '');
  },

  // 增量更新对话区（不重绘整个视图，保持麦克风状态）
  renderDialogue(){
    this.init();
    const sc = this.getScenario();
    const st = $('#seStatus');
    if(st){
      st.textContent = sc ? ('在线 · '+sc.icon+' '+sc.title+' · 第 '+Math.min(S.speak.currentLine+1, sc.teacherLines.length)+'/'+sc.teacherLines.length+' 轮')
                          : '在线 · 等待选择场景';
    }
    const box = $('#seMessages');
    if(box){ box.innerHTML = this.messagesHTML(); box.scrollTop = box.scrollHeight; }
    this.showHint();
    const vocab = $('#seVocab');
    if(vocab){
      vocab.innerHTML = sc ? sc.vocabulary.map(w=>{
        const d = WORD_DICT[w]; const zh = d ? d.pos.split(' ')[0] : '';
        return '<div class="scene-word-item" onclick="SpeakEngine.wordClick(\''+w+'\')"><div><div class="scene-word-en">'+w+'</div><div class="scene-word-zh">'+(zh||'点击听发音')+'</div></div><button><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg></button></div>';
      }).join('') : '<div style="font-size:12px;color:var(--text-2);padding:8px 4px">选择场景后显示词汇</div>';
    }
    const tip = $('#seTips');
    if(tip){ tip.textContent = sc ? sc.tips : '选择一个场景，和老师开始自由交谈吧！'; }
  }
};

function selectScenarioV5(id){
  SpeakEngineV5.init();
  S.speakV5.scenario = id;
  SpeakEngineV5._save();
  SpeakEngineV5.startDialog(S.speakV5.teacher, id);
  const box = document.getElementById('seV5Dialog');
  if(box) box.innerHTML = SpeakEngineV5.renderDialog();
  const status = document.getElementById('seStatus');
  const sc = (typeof SPEAK_SCENARIOS !== 'undefined') ? SPEAK_SCENARIOS.find(s=>s.id===id) : null;
  if(status && sc) status.textContent = '在线 · ' + sc.icon + ' ' + sc.title + (S.apiConfig&&S.apiConfig.groqKey?' · AI对话':' · 降级模式');
  if(typeof toast === 'function') toast('🎯 ' + (sc?sc.title:'场景') + ' · 开始对话！');
}
function selectTeacherV5(tid){
  SpeakEngineV5.init();
  S.speakV5.teacher = tid;
  SpeakEngineV5._save();
  $('#contentArea').innerHTML = renderSpeak();
  const t = SpeakEngineV5.getTeacher(tid);
  if(typeof toast === 'function') toast('👩‍🏫 ' + t.name + ' 老师已选中');
}
function wordClickV5(w){
  if(typeof speak === 'function') speak(w);
  const d = (typeof WORD_DICT !== 'undefined') ? WORD_DICT[w] : null;
  if(typeof toast === 'function') toast(d ? (w + ' ' + d.pos.split(' ')[0]) : (w + ' 🔊'));
}

function switchPersona(i){
  currentPersona=i;
  $('#contentArea').innerHTML=renderSpeak();
  bindSpeakEvents();
}

function fillTemplate(t){
  const inp=$('#chatInput');
  inp.value=t;
  inp.focus();
}

let isRecording=false;
function toggleMic(){
  isRecording=!isRecording;
  const btn=$('#micBtn');
  if(isRecording){
    btn.classList.add('recording');
    toast('开始录音...');
    setTimeout(()=>{
      if(isRecording){
        isRecording=false;
        btn.classList.remove('recording');
        const inp=$('#chatInput');
        inp.value="I'd like a pizza, please.";
        toast('识别完成 ✓');
      }
    },2500);
  }else{
    btn.classList.remove('recording');
  }
}

function bindSpeakEvents(){
  const inp=$('#chatInput');
  if(!inp)return;
  inp.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'&&!e.shiftKey){
      e.preventDefault();
      const text=inp.value.trim();
      if(!text)return;
      const msgs=$('#chatMessages');
      msgs.insertAdjacentHTML('beforeend',`<div class="msg me"><div class="msg-bubble">${makeClickableSentence(text)}</div></div>`);
      inp.value='';
      msgs.scrollTop=msgs.scrollHeight;
      setTimeout(()=>{
        msgs.insertAdjacentHTML('beforeend',`<div class="msg ai"><div class="msg-avatar"><img src="${PERSONAS[currentPersona].avatar}" alt=""></div><div><div class="msg-bubble">${makeClickableSentence("That sounds great! Anything else you'd like to try?")}</div></div></div>`);
        msgs.scrollTop=msgs.scrollHeight;
      },800);
    }
  });
}

function renderPet(){
  const pet=PETS[S.pet.idx];
  // 自动动作定时器：根据心情偶尔触发动作（心情>80 偶尔 wiggle，心情<30 显示 sleep）
  if(window._petAutoTimer){ clearInterval(window._petAutoTimer); window._petAutoTimer=null; }
  window._petAutoTimer = setInterval(()=>{
    const display = document.getElementById('petDisplay');
    if(!display){ clearInterval(window._petAutoTimer); window._petAutoTimer=null; return; }
    const mood = S.pet.mood || 0;
    // 用户触发的瞬时动作进行中则跳过，避免冲突
    const busy = display.classList.contains('happy')||display.classList.contains('roll')||display.classList.contains('spin')||display.classList.contains('wave')||display.classList.contains('nod')||display.classList.contains('surprise')||display.classList.contains('wiggle');
    if(busy) return;
    if(mood < 30){
      if(!display.classList.contains('sleep')) display.classList.add('sleep');
    }else if(mood > 80 && Math.random() < 0.4){
      ['happy','shake','spin','wave','nod','surprise','wiggle','roll','sleep'].forEach(c=>display.classList.remove(c));
      void display.offsetWidth;
      display.classList.add('wiggle');
      setTimeout(()=>display.classList.remove('wiggle'),1200);
    }else{
      if(display.classList.contains('sleep')) display.classList.remove('sleep');
    }
  }, 6000);
  return `
    <div class="pet-layout">
      <div class="pet-stage">
        <div class="pet-selector">
          ${PETS.map((p,i)=>`<div class="pet-sel-item ${i===S.pet.idx?'active':''}" onclick="switchPet(${i})"><img src="${p.avatar}" alt="${p.type}"></div>`).join('')}

          <button class="pet-action-btn" onclick="petAction('sleep')">💤 睡觉</button>
          <button class="pet-action-btn" onclick="petAction('wave')">👋 挥手</button>

        </div>

        <div class="pet-mini-wrap">
          <div class="pet-mini-head">

function petAction(action){
  const display=$('#petDisplay');
  const stage=$('.pet-stage');
  // 触发动作前先清理已有动作类并强制 reflow，确保新动画每次都能生效
  const playAnim=(cls,ms)=>{
    if(!display)return;
    ['happy','shake','spin','wave','nod','surprise','wiggle','roll','sleep'].forEach(c=>display.classList.remove(c));
    void display.offsetWidth;
    display.classList.add(cls);
    if(ms && cls!=='sleep'){ setTimeout(()=>display.classList.remove(cls),ms); }
  };
  if(action==='feed'){
    playAnim('wiggle',1200);
    S.pet.hunger = Math.min(100, S.pet.hunger + 10);
    showFloatTip(stage,'🍖 +10 饱食');
    toast('🍗 喂食成功！饱食+10');
  }else if(action==='play'){
    playAnim('roll',1000);
    S.pet.mood = Math.min(100, S.pet.mood + 15);
    S.pet.exp += 8;
    showFloatTip(stage,'🎮 +15 心情');
    toast('🎮 玩耍开心！心情+15 经验+8');
    checkPetLevelUp();
  }else if(action==='train'){
    playAnim('spin',1000);
    S.pet.exp += 20;
    showFloatTip(stage,'🎯 +20 经验');
    toast('🎯 训练完成！经验+20');
    checkPetLevelUp();
  }else if(action==='bath'){
    playAnim('surprise',500);
    S.pet.clean = Math.min(100, S.pet.clean + 12);
    showFloatTip(stage,'🛁 +12 清洁');
    toast('🛁 洗澡完成！清洁+12');
  }else if(action==='sleep'){
    playAnim('sleep',0);  // 无限循环打瞌睡，不自动移除
    S.pet.energy = Math.min(100, (S.pet.energy||0) + 10);
    showFloatTip(stage,'💤 +10 精力');
    toast('💤 宠物开始打瞌睡了～');
  }else if(action==='wave'){
    playAnim('wave',1000);
    S.pet.mood = Math.min(100, (S.pet.mood||0) + 3);
    showFloatTip(stage,'👋 挥挥手');
    toast('👋 宠物在和你打招呼～');
  }else if(action==='nod'){
    playAnim('nod',1200);
    S.pet.mood = Math.min(100, (S.pet.mood||0) + 5);
    showFloatTip(stage,'👍 +5 心情');
    toast('👍 宠物点头赞同～');
  }
  saveState();
  const fpLv = document.querySelector('#floatingPet [style*="Lv"]');
  if(fpLv) fpLv.textContent = 'Lv'+S.pet.level;
}

function checkPetLevelUp(){
  if(S.pet.exp >= 100){
    const lvUpCount = Math.floor(S.pet.exp / 100);
    S.pet.level += lvUpCount;
    S.pet.exp = S.pet.exp % 100;
    toast(`🎉 恭喜升级！宠物达到 Lv.${S.pet.level}`);
    S.pet.coins += 10 * lvUpCount;
    const fpLv = document.querySelector('#floatingPet [style*="Lv"]');
    if(fpLv) fpLv.textContent = 'Lv'+S.pet.level;
  }
}

function showFloatTip(stage,text){
  const tip=document.createElement('div');
  tip.className='float-tip';
  tip.textContent=text;
  tip.style.left='50%';
  tip.style.top='40%';
  tip.style.transform='translateX(-50%)';
  stage.appendChild(tip);
  setTimeout(()=>tip.remove(),1200);
}

/* ============ 口语波形 & 评分 ============ */
let waveformTimer=null;
let wfRecording=false;
function startWaveformRec(){
  if(wfRecording)return;
  wfRecording=true;
  const status=$('#wfStatus');
  const recBtn=$('#wfRecBtn');
  const recText=$('#wfRecText');
  const stopBtn=$('#wfStopBtn');
  if(status){status.className='wf-status rec';status.innerHTML='<span>●</span> 录音中...';}
  if(recBtn){recBtn.className='wf-btn warn';}
  if(recText){recText.textContent='录音中';}
  if(stopBtn){stopBtn.style.display='flex';}
  toast('🎤 开始录音，请跟读...');
  waveformTimer=setInterval(()=>{
    for(let i=0;i<20;i++){
      const bar=$('#wfBar'+i);
      if(bar){
        const h=20+Math.random()*75;
        bar.style.height=h+'%';
        bar.classList.remove('silence');
      }
    }
  },80);
  setTimeout(()=>{
    if(wfRecording)stopWaveformRec();
  },3000);
}
function stopWaveformRec(){
  wfRecording=false;
  if(waveformTimer){clearInterval(waveformTimer);waveformTimer=null;}
  for(let i=0;i<20;i++){
    const bar=$('#wfBar'+i);
    if(bar){
      bar.style.height=(20+Math.random()*20)+'%';
      bar.classList.add('silence');
    }
  }
  const status=$('#wfStatus');
  const recBtn=$('#wfRecBtn');
  const recText=$('#wfRecText');
  const stopBtn=$('#wfStopBtn');
  if(status){status.className='wf-status idle';status.innerHTML='<span>●</span> 已完成';}
  if(recBtn){recBtn.className='wf-btn primary';}
  if(recText){recText.textContent='再录一次';}
  if(stopBtn){stopBtn.style.display='none';}
  toast('✅ 录音完成，正在评分...');
  setTimeout(showScoreCard,500);
}

function renderHeatmap(){
  const rows=['计算能力','几何图形','解决问题','自然拼读','口语对话','语法词汇'];
  const weak=[
    [{c:3,k:'通分-最小公倍数',s:'需短除法专项训练'},{c:4,k:'退位连减',s:'借位标记不清晰'}],
    [{c:3,k:'面积单位换算',s:'km²/m² 进率混淆'},{c:4,k:'长方体展开',s:'对面识别错误'}],
    [{c:4,k:'多步问题审题',s:'遗漏隐藏条件'},{c:3,k:'等量代换',s:'替换顺序有误'}],
    [{c:3,k:'th 清浊音',s:'think/this 混淆'},{c:4,k:'魔法 e 静音',s:'like/lake 区分度 65%'}],
    [{c:4,k:'第三人称单数',s:'动词+s 漏掉'},{c:3,k:'语调升降',s:'疑问句尾语调平'}],
    [{c:3,k:'现在进行时',s:'be 动词遗漏'},{c:4,k:'比较级不规则',s:'good→better 未掌握'}]
  ];
  const palette=['#CFF6EE','#5FE0C5','#00A896','#FB923C','#DC2626'];
  const weakPoints=[];
  let html='<div class="heat-grid">';
  rows.forEach((r,ri)=>{
    html+='<div class="heat-row"><div class="heat-label">'+r+'</div>';
    for(let c=0;c<12;c++){
      let lvl;
      const wk=weak[ri].find(w=>w.c===c);
      if(wk){lvl=3+Math.floor(Math.random()*2);weakPoints.push({row:r,kn:wk.k,sug:wk.s});}
      else{const rnd=Math.random();lvl=rnd<0.35?0:rnd<0.7?1:rnd<0.92?2:3;}
      const bg=palette[lvl];const t=['掌握','熟练','一般','薄弱','危险'][lvl];
      const sub=wk?wk.k:(r+' 子知识点');
      html+='<div class="heat-cell" style="background:'+bg+"\" onclick=\"toast('知识点掌握："+t+'<br>'+sub+"')\"></div>";
    }
    html+='</div>';
  });
  html+='</div>';
  $('#weakPointsList')&&(weakPoints.slice(0,3).forEach(w=>{

    $('#weakPointsList').appendChild(el);
  }));
  return html;
}

function bindAiConfigEvents(){

    else{inp.type='password';this.textContent='👁 显示';}
  };
  const testBtn=$('#testGroqKeyBtn');
  if(testBtn) testBtn.onclick=testGroqKey;
  const saveBtn=$('#saveGroqKeyBtn');
  if(saveBtn) saveBtn.onclick=saveGroqKey;
  const clearBtn=$('#clearGroqKeyBtn');
  if(clearBtn) clearBtn.onclick=function(){
    if(!confirm('确定清除 API Key 吗？清除后口语将降级为分支对话模式。')) return;
    if(!S.apiConfig) S.apiConfig={};
    S.apiConfig.groqKey='';

    const inp=$('#groqKeyInput');
    if(inp) inp.value='';
    showGroqTestResult('error','已清除 API Key。口语伙伴将使用降级模式。');
  };
}
function showGroqTestResult(type,msg){
  const el=$('#groqTestResult');
  if(!el) return;
  el.style.display='block';
  if(type==='ok'){
    el.style.background='rgba(0,168,150,.12)';
    el.style.color='var(--teal)';
    el.style.border='1px solid rgba(0,168,150,.3)';
  }else if(type==='error'){
    el.style.background='rgba(220,38,38,.08)';
    el.style.color='#DC2626';
    el.style.border='1px solid rgba(220,38,38,.2)';
  }else{
    el.style.background='rgba(245,184,0,.12)';
    el.style.color='var(--yellow)';
    el.style.border='1px solid rgba(245,184,0,.3)';
  }
  el.innerHTML=msg;
}
async function testGroqKey(){
  const inp=$('#groqKeyInput');
  if(!inp) return;
  const key=inp.value.trim();
  if(!key){
    showGroqTestResult('error','⚠️ 请先输入 API Key');
    return;
  }
  if(!key.startsWith('gsk_')){
    showGroqTestResult('error','⚠️ Groq API Key 通常以 <code style="background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px">gsk_</code> 开头，请检查是否复制完整');
    return;
  }
  const btn=$('#testGroqKeyBtn');
  const oldText=btn.textContent;
  btn.textContent='⏳ 测试中...';
  btn.disabled=true;
  showGroqTestResult('loading','🔍 正在连接 Groq API...');
  try{
    const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+key
      },
      body:JSON.stringify({
        model:'llama-3.1-8b-instant',
        messages:[{role:'user',content:'Say "OK" in one word.'}],
        max_tokens:5
      })
    });
    if(resp.ok){
      const data=await resp.json();
      const reply=data&&data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
      showGroqTestResult('ok','✅ 连接成功！AI 回复：<b>'+(reply||'OK')+'</b><br>点击"保存"即可启用 AI 自由对话。');
    }else if(resp.status===401){
      showGroqTestResult('error','❌ 认证失败：API Key 无效或已过期，请重新获取');
    }else if(resp.status===429){
      showGroqTestResult('error','⚠️ 请求过于频繁或额度已用完，请稍后再试');
    }else{
      showGroqTestResult('error','❌ 连接失败：HTTP '+resp.status);
    }
  }catch(e){
    showGroqTestResult('error','❌ 网络错误：'+(e.message||'无法连接到 Groq API')+'<br>请检查网络或稍后重试');
  }finally{
    btn.textContent=oldText;
    btn.disabled=false;
  }
}
function saveGroqKey(){
  const inp=$('#groqKeyInput');
  if(!inp) return;
  const key=inp.value.trim();
  if(!key){
    showGroqTestResult('error','⚠️ 请先输入 API Key');
    return;
  }
  if(!S.apiConfig) S.apiConfig={};
  S.apiConfig.groqKey=key;
  saveState();
  showGroqTestResult('ok','✅ 已保存！口语伙伴的 AI 自由对话已启用。');
  toast('✅ API Key 已保存');
}

    toast(`已取消收藏 ${w}`);
  }
  renderSidePanel&&render('english');
}
function flipFlash(i){
  const c=$('#flashCard'+i);
  if(c&&!c.classList.contains('known'))c.classList.toggle('flipped');
}
function unflipFlash(i){
  const c=$('#flashCard'+i);
  if(c)c.classList.remove('flipped');
}
function markFlashKnown(i){
  const c=$('#flashCard'+i);
  if(!c||c.classList.contains('known'))return;
  c.classList.add('known');
  c.classList.remove('flipped');
  flashKnownCount++;
  S.eng.learnedWords=Math.max(S.eng.learnedWords,flashKnownCount);
  saveState();
  const bar=$('#flashBar');const cnt=$('#flashCount');
  if(bar)bar.style.width=(flashKnownCount/4*100)+'%';
  if(cnt)cnt.textContent=`${flashKnownCount} / 4`;
  if(flashKnownCount===1)setStar(2,'认识1个单词');
  else if(flashKnownCount===2)setStar(2,'又认识1个');
  else if(flashKnownCount===3)setStar(2,'继续加油');
  else if(flashKnownCount===4){
    setStar(8,'闪卡挑战完成！');
    toast('🎉 闪卡记忆挑战完成！');
  }
}
function switchGramPill(id){
  $$('#gramPills .gram-pill').forEach(p=>p.classList.toggle('active',p.dataset.pill===id));
  const g=GRAMMAR_PILLS[id];if(!g)return;
  const ruleEl=$('#gramContent .gram-rule');
  const sensEl=$('#gramSentences');
  if(ruleEl)ruleEl.innerHTML=`📖 <strong style="color:var(--yellow-700)">${g.name}规则：</strong>${g.rule}`;
  if(sensEl){
    sensEl.innerHTML=g.sentences.map((s,i)=>`<div class="gram-sen" id="gramSen${i}" onclick="playGramSen(${i},'${s.en.replace(/<[^>]+>/g,'').replace(/'/g,'')}')">
      <div class="gram-sen-num">${i+1}</div>
      <div class="gram-sen-body">${s.en}<span class="gram-sen-cn">${s.cn}</span></div>
      <div class="gram-sen-wave">
        <svg viewBox="0 0 60 24" preserveAspectRatio="none">
          <rect x="2" y="10" width="4" height="4" rx="2" fill="var(--teal)"><animate attributeName="y" values="4;14;4" dur="0.8s" repeatCount="indefinite"/></rect>
          <rect x="12" y="6" width="4" height="12" rx="2" fill="var(--teal)"><animate attributeName="y" values="2;16;2" dur="1s" repeatCount="indefinite"/></rect>
          <rect x="22" y="8" width="4" height="8" rx="2" fill="var(--teal)"><animate attributeName="y" values="6;12;6" dur="0.7s" repeatCount="indefinite"/></rect>
          <rect x="32" y="4" width="4" height="16" rx="2" fill="var(--teal)"><animate attributeName="y" values="2;14;2" dur="0.9s" repeatCount="indefinite"/></rect>
          <rect x="42" y="8" width="4" height="8" rx="2" fill="var(--teal)"><animate attributeName="y" values="4;14;4" dur="0.85s" repeatCount="indefinite"/></rect>
          <rect x="52" y="10" width="4" height="4" rx="2" fill="var(--teal)"><animate attributeName="y" values="6;12;6" dur="1.1s" repeatCount="indefinite"/></rect>
        </svg>
      </div>
    </div>`).join('');
  }
}
function playGramSen(i,text){
  const sen=$('#gramSen'+i);if(!sen)return;
  $$('.gram-sen').forEach(s=>s.classList.remove('playing'));
  sen.classList.add('playing');
  speak(text);
  setTimeout(()=>sen.classList.remove('playing'),2500);
}
function playListenAudio(text){
  speak(text);
  toast('🔊 正在播放听力音频...');
}
function checkListenBlank(i,ans){
  const inp=$('#listenInput'+i);
  const btn=$('#listenChk'+i);
  if(!inp||!btn)return;
  const val=inp.value.trim().toLowerCase();
  const correct=val===ans.toLowerCase();
  btn.classList.remove('correct','wrong');
  btn.classList.add(correct?'correct':'wrong');
  btn.textContent=correct?'✓ 正确':'✗ 再想想';
  if(correct){
    inp.style.borderColor='var(--teal)';
    inp.style.background='rgba(0,168,150,.25)';
    setStar(1,'听力答对');
    toast(`✅ 太棒了！正确答案：${ans}`);
  }else{
    inp.style.borderColor='#EF4444';
    inp.style.background='rgba(239,68,68,.15)';
    toast(`💡 提示：首字母是 ${ans[0].toUpperCase()}，共 ${ans.length} 个字母`);
  }
}

/* ============ 徽章定义 ============ */
const BADGES=[
  {id:'first_word',name:'初次发音',icon:'🗣️',cond:()=>true},
  {id:'week_streak_7',name:'周冠军',icon:'🔥',cond:()=>S.overview.streak>=7},
  {id:'phonics_stage3',name:'拼读大师',icon:'🔤',cond:()=>S.eng.phonicsStage>=3},
  {id:'math_cpa_100',name:'CPA达人',icon:'🧩',cond:()=>S.math.moduleProgress.cpa>=100},
  {id:'vocab_100',name:'百词斩',icon:'📚',cond:()=>S.eng.learnedWords>=100},
];

/* ============ 路由 & 初始化 ============ */
let currentView='overview';
let currentMathGrade=S.math.grade;
let currentEngGrade=S.eng.grade;
let currentEngSub=S.eng.sub;
if(!['vocab','phonics','phrases','grammar','listen'].includes(currentEngSub)){currentEngSub='vocab';S.eng.sub='vocab';saveState();}
currentPhonicsStage=S.eng.phonicsStage;
let flashKnownCount=0;

function switchView(view){
  if(!document.startViewTransition){
    currentView=view;S[view==='math'?'math':view==='english'?'eng':'pet']=S[view==='math'?'math':view==='english'?'eng':'pet'];
    $$('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));
    render();return;
  }
  document.startViewTransition(()=>{
    currentView=view;
    $$('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));
    render();
  });
}

function render(){
  const area=$('#contentArea');
  if(currentView==='overview')area.innerHTML=renderOverview();
  else if(currentView==='math')area.innerHTML=renderMath(currentMathGrade);
  else if(currentView==='english')area.innerHTML=renderEnglish(currentEngGrade,currentEngSub);
  else if(currentView==='speak'){area.innerHTML=renderSpeak();bindSpeakEvents();}
  else if(currentView==='pet')area.innerHTML=renderPet();
  bindDynamicEvents();
}

/* ============ 视图工具：Bento栅格 + 3D卡片 + 浮动宠物 ============ */
function badgeDots(){
  return (S.badges.length?`<span style="position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:white;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center">${S.badges.length}</span>`:'');
}
function bindDynamicEvents(){
  // 顶部 nav
  $$('.nav-tab').forEach(t=>t.onclick=()=>switchView(t.dataset.view));
  // 数学年级
  $$('#mathGrades .grade-pill').forEach(p=>p.onclick=()=>{
    currentMathGrade=p.dataset.grade;S.math.grade=currentMathGrade;saveState();
    $$('#mathGrades .grade-pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    render();
  });
  // 英语年级
  $$('#engGrades .grade-pill').forEach(p=>p.onclick=()=>{
    currentEngGrade=p.dataset.grade;S.eng.grade=currentEngGrade;saveState();
    flashKnownCount=0;
    $$('#engGrades .grade-pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    render();
  });
  // 英语子tab
  $$('#engSubtabs .sub-tab').forEach(t=>t.onclick=()=>{
    currentEngSub=t.dataset.sub;S.eng.sub=currentEngSub;saveState();
    flashKnownCount=0;
    $$('#engSubtabs .sub-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render();
  });
  // 短语场景
  $$('#sceneTabs .scene-tab').forEach(t=>t.onclick=()=>{
    $$('#sceneTabs .scene-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const scene=t.dataset.scene;
    $('#phraseGrid').innerHTML=PHRASE_BANK[scene].map(p=>renderPhraseCard(p)).join('');
  });
  // 拼读阶段切换
  $$('#phonicsStages .phonics-stage').forEach(s=>s.onclick=()=>{
    currentPhonicsStage=parseInt(s.dataset.stage);S.eng.phonicsStage=currentPhonicsStage;saveState();
    $$('#phonicsStages .phonics-stage').forEach(x=>x.classList.remove('active'));
    s.classList.add('active');
    render();
  });
  // 3D 卡片微交互
  $$('.tilt-card').forEach(el=>{
    el.addEventListener('mousemove',e=>{
      const r=el.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      el.style.transform=`perspective(900px) rotateX(${(-y*6).toFixed(2)}deg) rotateY(${(x*8).toFixed(2)}deg) translateY(-2px)`;
    });
    el.addEventListener('mouseleave',()=>{el.style.transform='';});
  });
}

// 初始化
document.addEventListener('DOMContentLoaded',()=>{
  // 解锁音频引擎：监听首次用户手势（click/touchstart），触发空 utterance 解锁移动端音频
  const _unlockOnce = ()=>{ unlockAudio(); document.removeEventListener('click',_unlockOnce); document.removeEventListener('touchstart',_unlockOnce); };
  document.addEventListener('click',_unlockOnce);
  document.addEventListener('touchstart',_unlockOnce);
  // 语音列表异步加载完成后刷新标记
  if('speechSynthesis' in window){
    try{ speechSynthesis.onvoiceschanged = ()=>{ _speakVoicesReady = true; }; }catch(e){}
  }
  $('#parentBtn').onclick=openParentPanel;
  $('#parentClose').onclick=()=>{disposeParentCharts();$('#parentModal').classList.remove('show')};
  $('#parentModal').onclick=(e)=>{if(e.target.id==='parentModal'){disposeParentCharts();$('#parentModal').classList.remove('show')}};
  $('#micToggle').onclick=function(){
    this.classList.toggle('active');
    toast(this.classList.contains('active')?'语音模式开启':'语音模式关闭');
  };
  // 注入浮动宠物
  const pet=document.createElement('div');
  pet.innerHTML=`
    <div id="floatingPet" style="position:fixed;bottom:24px;right:24px;z-index:90;cursor:pointer;transition:transform var(--dur-base) var(--ease-spring)"
      onmouseover="this.style.transform='scale(1.08) translateY(-4px)'"
      onmouseout="this.style.transform=''"
      onclick="switchView('pet')">
      <div style="width:88px;height:88px;border-radius:28px;background:white;box-shadow:var(--shadow-xl);padding:6px;position:relative;border:1.5px solid var(--teal-200)">
        <img src="${PETS[S.pet.idx].avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:22px" alt="pet">
        <div style="position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:var(--navy-800);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md)">Lv${S.pet.level}</div>
        <div style="position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:var(--teal);color:white;font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap;box-shadow:var(--shadow-sm)">点我去乐园</div>
      </div>
    </div>`;
  document.body.appendChild(pet);
  render();
  setTimeout(()=>toast('👋 欢迎回来！今天也要加油哦！'),400);
  // 自动检查徽章
  setTimeout(()=>{BADGES.forEach(b=>{if(b.cond())addBadge(b.id,b.name,b.icon);});},2000);
});
